name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # CodeQL's C/C++ query pack changes independently of our code, so code that
    # was clean last month can turn up new findings without a single line changed here.
    - cron: "41 6 * * 3"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (cpp)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual

      # Compile the component's sources with plain g++ and the unit-test flags, in parallel and
      # without linking: CodeQL analyses what it sees compiled, so the test suite and gtest stay out
      # of the scan and the build needs no ESPHome/PlatformIO toolchain, Docker, gtest or pyyaml.
      - run: make host-component-objs

      - uses: github/codeql-action/analyze@v4
