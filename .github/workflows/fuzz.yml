name: Fuzz

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly, Monday 06:00 UTC — not per-PR; fuzzing is time-boxed background work.
  workflow_dispatch:

jobs:
  fuzz-frame:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: pip install --user pyyaml
      - run: make fuzz-frame FUZZ_TIME=300
      # Replay a finding with: ./build/fuzz/<binary> <downloaded-file>
      - name: Upload crash/leak/timeout/oom artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-frame-findings
          if-no-files-found: warn
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*

  fuzz-soft-phy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: pip install --user pyyaml
      - run: make fuzz-soft-phy FUZZ_TIME=300
      # Replay a finding with: ./build/fuzz/<binary> <downloaded-file>
      - name: Upload crash/leak/timeout/oom artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-soft-phy-findings
          if-no-files-found: warn
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*

  fuzz-bridle-codec:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: pip install --user pyyaml
      - run: make fuzz-bridle-codec FUZZ_TIME=300
      - name: Upload crash/leak artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-bridle-codec-findings
          path: |
            crash-*
            leak-*

  fuzz-io2g4-unwrap:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: pip install --user pyyaml
      - run: make fuzz-io2g4-unwrap FUZZ_TIME=300
      - name: Upload crash/leak artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-io2g4-unwrap-findings
          path: |
            crash-*
            leak-*
