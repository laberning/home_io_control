name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make format-check

  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y yamllint
      - run: make yamllint

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: clang-tidy --version
      - run: make clang-tidy

  tuning-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make tuning-sync

  yaml-emitter-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make yaml-emitter-sync

  board-pinout-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make board-pinout-sync

  corpus-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pip install --user pyyaml
      - run: make corpus-validate

  docs-link-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make docs-link-check

  key-material-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make key-material-scan

  test-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make firmware-test

  unit-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - run: pip install --user pyyaml
      - run: make unit-test

  unit-test-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - run: pip install --user pyyaml
      - run: make unit-test-asan

  doxygen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y graphviz python3-pygments
      - run: make doxygen
