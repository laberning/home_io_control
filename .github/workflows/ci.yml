name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: clang-format-21 --version
      - run: make format-check CLANG_FORMAT=clang-format-21

  yamllint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y yamllint
      - run: make yamllint

  # Two parallel halves of `make clang-tidy`: each shard builds the compile database and analyzes
  # every second translation unit (CLANG_TIDY_SHARD in scripts/run-clang-tidy.sh), so together they
  # cover every file once. Locally `make clang-tidy` still runs them all.
  tidy:
    name: tidy (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - run: clang-tidy-21 --version
      - run: make clang-tidy
        env:
          CLANG_TIDY: clang-tidy-21
          RUN_CLANG_TIDY: run-clang-tidy-21
          CLANG_TIDY_SHARD: ${{ matrix.shard }}/2

  tuning-sync:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make tuning-sync

  yaml-emitter-sync:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make yaml-emitter-sync

  include-graph:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make include-graph

  stub-sync:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make stub-sync

  board-pinout-sync:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make board-pinout-sync

  corpus-validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: pip install --user pyyaml
      - run: make corpus-validate

  docs-link-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make docs-link-check

  key-material-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make key-material-scan

  private-path-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make private-path-check

  # Two parallel halves of `make firmware-test`; the groups live in the Makefile
  # (FIRMWARE_TEST_GROUP_1/_2), and firmware-test-groups-check fails if a config is in neither.
  test-compile:
    name: test-compile (group ${{ matrix.group }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - run: make firmware-test-group-${{ matrix.group }}

  unit-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - run: pip install --user pyyaml
      - run: make unit-test

  py-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make py-test

  unit-test-asan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - run: pip install --user pyyaml
      - run: make unit-test-asan

  doxygen:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y graphviz python3-pygments
      - run: make doxygen
