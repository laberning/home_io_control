substitutions:
  device_name: hioc-heltec-v2
  device_friendly_name: Home IO Control WiFi LoRa32 V2 Monitor

## Passive IO-Homecontrol monitor for Heltec WiFi LoRa32 V2.
## This config intentionally defines no IO entities and no pairing button.
## The component still keeps the radio in RX, hops channels, and logs parsed traffic.

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  build_flags:
    - -DIOHOME_FRAME_LOG

# Board SPI bus + radio pinout — single source of truth in config/boards/.
packages:
  board: !include boards/heltec-v2.yaml

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      path: components

home_io_control:
  node_id: ABC123
  system_key: ABCDEF1234567890ABCDEF1234567891
