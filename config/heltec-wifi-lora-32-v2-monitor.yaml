substitutions:
  device_name: hioc-heltec-v2
  device_friendly_name: Home IO Control WiFi LoRa32 V2 Monitor

## Passive IO-Homecontrol monitor for Heltec WiFi LoRa32 V2.
## This config intentionally defines no IO entities and no pairing button.
## The component still keeps the radio in RX, hops channels, and logs parsed traffic.

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  platformio_options:
    build_flags:
      - -DIOHOME_FRAME_LOG

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

spi:
  clk_pin: 5
  mosi_pin: 27
  miso_pin: 19

external_components:
  - source:
      type: local
      path: components

home_io_control:
  cs_pin: 18
  rst_pin: 14
  dio0_pin: 26
  node_id: ABC123
  system_key: ABCDEF1234567890ABCDEF1234567891
