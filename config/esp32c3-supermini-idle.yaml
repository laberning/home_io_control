## ESP32-C3 SuperMini that does nothing on the Bridle link: WiFi, API and OTA only, no
## `home_io_control`, so it never sends `hello`.
##
## The USB phase of the 868 bench talks to the Kite over USB, and a Kite takes the first link that
## sends it a valid command as its host link until its next reset (spec §2.1). Flash this over WiFi
## first, so the C3 cannot claim the UART; flash esp32c3-supermini-bridle-868.yaml again to go back.

substitutions:
  device_name: hioc-esp32c3-bridle-868

esphome:
  name: ${device_name}
  friendly_name: Home IO Control ESP32-C3 SuperMini (idle)

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # SuperMini antenna quirk: at full TX power the association fails with "Auth Expired".
  output_power: 8.5dB

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password
