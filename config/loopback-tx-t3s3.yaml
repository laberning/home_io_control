## Radio Loopback Test — T3-S3 (LR1121) TX
## Transmits known test frames on CH2 (868.95 MHz) with varying preamble lengths.
## Flash this on the T3-S3, then flash loopback-rx-v2.yaml on the V2.

esphome:
  name: loopback-tx-t3s3
  friendly_name: Loopback TX T3-S3
  build_flags:
    - -DIOHOME_FRAME_LOG

# Board SPI bus + radio pinout — single source of truth in config/boards/.
packages:
  board: !include boards/t3s3.yaml

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      path: components

home_io_control:
  id: hioc
  node_id: "C0FFEE"
  system_key: "00112233445566778899AABBCCDDEEFF"

globals:
  - id: tx_case
    type: int
    initial_value: '-1'
  - id: tx_repeat
    type: int
    initial_value: '0'
  - id: tx_running
    type: bool
    initial_value: 'false'

button:
  - platform: template
    name: "Start TX Test"
    on_press:
      - lambda: |-
          id(hioc)->set_radio_test_mode(true);
          auto *radio = id(hioc)->get_radio();
          radio->change_frequency(esphome::home_io_control::FREQ_CH2);
          radio->set_mode_rx();
          id(tx_case) = 0;
          id(tx_repeat) = 0;
          id(tx_running) = true;
          ESP_LOGI("loopback", "========================================");
          ESP_LOGI("loopback", "  LOOPBACK TX START — LR1121");
          ESP_LOGI("loopback", "  Channel: CH2 (868.95 MHz)");
          ESP_LOGI("loopback", "========================================");

interval:
  - interval: 2s
    then:
      - lambda: |-
          using namespace esphome::home_io_control;
          if (!id(tx_running)) return;

          auto *hub = id(hioc);
          auto *radio = hub->get_radio();
          if (radio == nullptr) {
            ESP_LOGE("loopback", "Radio not initialized!");
            id(tx_running) = false;
            return;
          }

          // Test frame definitions (must match RX side exactly)
          // Frame 0: all zeros (9 bytes)
          static const uint8_t F_ZEROS[] = {0xC8,0x00, 0x00,0x00,0x00, 0x00,0x00,0x00, 0x00};
          // Frame 1: all 0xFF (9 bytes)
          static const uint8_t F_ONES[] = {0xFF,0xFF, 0xFF,0xFF,0xFF, 0xFF,0xFF,0xFF, 0xFF};
          // Frame 2: alternating pattern (9 bytes)
          static const uint8_t F_PATTERN[] = {0xC8,0x00, 0x55,0xAA,0xFF, 0x00,0x55,0xAA, 0x28};
          // Frame 3: key transfer (18 bytes) — the actual problematic frame
          static const uint8_t F_KEY[] = {
            0x51,0x00, 0xAA,0xBB,0xCC, 0xC0,0xFF,0xEE, 0x32,
            0x01,0x23,0x45,0x67, 0x89,0xAB,0xCD,0xEF, 0xDE
          };

          struct TestCase { const char *name; const uint8_t *data; uint8_t len; uint16_t preamble; };
          static const TestCase cases[] = {
            {"zeros_p8",      F_ZEROS,   9,  8},
            {"zeros_p64",     F_ZEROS,   9,  64},
            {"ones_p8",       F_ONES,    9,  8},
            {"ones_p64",      F_ONES,    9,  64},
            {"pattern_p8",    F_PATTERN, 9,  8},
            {"pattern_p64",   F_PATTERN, 9,  64},
            {"key_xfer_p8",   F_KEY,     18, 8},
            {"key_xfer_p64",  F_KEY,     18, 64},
            {"key_xfer_p256", F_KEY,     18, 256},
            {"key_xfer_p1024",F_KEY,     18, 1024},
          };
          static const int NUM_CASES = 10;

          int c = id(tx_case);
          int r = id(tx_repeat);

          if (c >= NUM_CASES) {
            ESP_LOGI("loopback", "========================================");
            ESP_LOGI("loopback", "  TX COMPLETE");
            ESP_LOGI("loopback", "========================================");
            id(tx_running) = false;
            return;
          }

          auto &tc = cases[c];
          ESP_LOGI("loopback", "TX [%d/%d r%d] \"%s\" len=%u preamble=%u",
                   c+1, NUM_CASES, r+1, tc.name, tc.len, tc.preamble);

          // Log the bytes being sent
          char hex[60];
          int pos = 0;
          for (int i = 0; i < tc.len && pos < 58; i++) {
            pos += snprintf(hex + pos, sizeof(hex) - pos, "%02X ", tc.data[i]);
          }
          ESP_LOGI("loopback", "  bytes: %s", hex);

          // Send
          RadioTxConfig cfg;
          cfg.freq_hz = FREQ_CH2;
          cfg.preamble_len = tc.preamble;
          bool ok = radio->send_packet(tc.data, tc.len, cfg);
          ESP_LOGI("loopback", "  result: %s", ok ? "OK" : "FAILED");

          // Back to RX
          radio->change_frequency(FREQ_CH2);
          radio->set_mode_rx();

          // Advance
          r++;
          if (r >= 3) {
            r = 0;
            c++;
          }
          id(tx_case) = c;
          id(tx_repeat) = r;
