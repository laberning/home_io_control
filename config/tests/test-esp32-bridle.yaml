# Compile test for `radio_type: bridle` (a radio co-processor behind a UART).
#
# Standalone rather than `<<: !include common.yaml`: common.yaml declares an spi: bus and SX1276
# pins, and a bridge has neither. It is the one compile test that builds the Bridle sources
# (IOHOME_BRIDLE) against the committed Bridle enum header. It builds with the frame log, so the held log of a
# bridge build holds the trace's 12 lines and the frame log's 12 (24, set by codegen); the sibling
# test-esp32-bridle-868.yaml builds without it (12), and radio_bridle_trace.cpp checks the exact number in both.
substitutions:
  device_name: test-bridle

esphome:
  name: ${device_name}
  merge_warnings: false
  build_flags:
    - -DIOHOME_FRAME_LOG

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: "test-ssid"
  password: "test12345"

api:

external_components:
  - source:
      type: local
      path: ../components

uart:
  id: bridle_uart
  tx_pin: 17
  rx_pin: 16
  baud_rate: 1000000
  rx_buffer_size: 1024

home_io_control:
  radio_type: bridle
  uart_id: bridle_uart
  rst_pin: 4
  bridle_band: io_2g4
  bridle_trace: true
  tx_power: 4
  node_id: C0FFEE
  system_key: 0123456789ABCDEF0123456789ABCDEF
  discover_and_pair_button: true
  # The tuning entities of the keys that apply to the band: none of the other chips' keys exist here.
  tuning:
    ui_controls: true

cover:
  - platform: home_io_control
    name: "Test Cover"
    io_device_id: "FEEB1E"
    device_class: awning
    io_device_type: "vertical_exterior_awning"
