# Minimal test configuration for home_io_control component
# This provides just enough to compile the component and one entity of each type.
substitutions:
  device_name: test_common

esphome:
  name: ${device_name}
  # Required for the name: None case on "Test Window Cover" below (validate_entity_name()'s
  # device-name idiom via the literal `None` requires esphome: friendly_name: to be set, matching
  # ENTITY_BASE_SCHEMA's own upstream behavior).
  friendly_name: "Test Common"
  # The framework-specific test-*.yaml files intentionally restate `substitutions` and `esp32`
  # after `<<: !include common.yaml` (YAML merge keys pick a winner per top-level key rather than
  # deep-merging) — silence the resulting "already defined" noise since that's expected here.
  merge_warnings: false
  # Exercises the device_id: sub-device path (companion sensors/buttons inheriting their parent's
  # ESPHome device) on "Test Cover"/"Test Window Cover"/"Test Light" below. "Test Silent Cover"/
  # "Test Dimmable Light"/"Test Switch" deliberately have no device_id:, so both branches compile.
  devices:
    - id: dev_cover
      name: "Test Cover Device"
    - id: dev_light
      name: "Test Light Device"

# Minimal esp32 config; framework (arduino/esp-idf) set in platform-specific files
esp32:
  variant: esp32

logger:
  level: DEBUG

wifi:
  ssid: "test-ssid"
  password: "test12345"

api:

external_components:
  - source:
      type: local
      path: ../components

spi:
  # Heltec WiFi LoRa32 v2 pinout (SX1276)
  clk_pin: 5
  mosi_pin: 27
  miso_pin: 19

home_io_control:
  cs_pin: 18
  rst_pin: 14
  dio0_pin: 26
  radio_type: sx1276
  node_id: C0FFEE
  system_key: 0123456789ABCDEF0123456789ABCDEF
  accept_foreign_pairing: true
  recover_oneway_key: true
  # Two identities: one inheriting the hub system_key with a derived node_id, one with its own
  # key and an explicit address — the two shapes the schema has to support.
  oneway_controllers:
    - id: awning_remote
      io_device_type: awning
      commands: [open, close, stop]
    - id: adopted_neighbour_net
      node_id: A11CE0
      system_key: FEDCBA98765432100123456789ABCDEF
      # Named form (validate_manufacturer()), not raw hex -- the raw-hex escape hatch is exercised
      # separately by hub_management_test.cpp / the schema unit tests.
      manufacturer: somfy
      io_device_type: roller_shutter
      initial_sequence: 1234
      # Exercises the "no commands:" shape too — an identity driven only by the
      # oneway_set_position action still gets its Last 1W Command sensor.
      commands: []
      # Exercises the enrollment: true build flag (Phase 3B) so its generated "Enroll 1W
      # Controller" button compiles — manufacturer: above is already set, which enrollment
      # requires.
      enrollment: true

# At least one entity of each type is needed to ensure all platform code compiles
cover:
  - platform: home_io_control
    device_id: dev_cover
    name: "Test Cover"
    io_device_id: "FEEB1E"
    device_class: awning
    io_device_type: "awning"
    linked_remotes: ["class:awning", "class:0x14"]
    optimistic_state: false
  # Declaring `silent:` is what generates the runtime Silent Operation switch; the cover above
  # omits it, so this pair compiles both branches of that codegen.
  - platform: home_io_control
    name: "Test Silent Cover"
    io_device_id: "FEEB2E"
    device_class: shutter
    io_device_type: "roller_shutter"
    silent: true
  # window_opener is the one device type that also generates a ventilation-position companion
  # button (device_supports_vent()) alongside the favorite-position one; neither cover above uses
  # a vent-capable io_device_type, so without this entry that codegen path never compiles.
  # name: None (rather than "") also exercises validate_entity_name()'s other device-name idiom
  # branch — needs the explicit id: below since companion_id_base() has nothing else to key off.
  - platform: home_io_control
    device_id: dev_cover
    id: test_window_cover
    name: None
    io_device_id: "FEEB2F"
    device_class: window
    io_device_type: "window_opener"

light:
  - platform: home_io_control
    device_id: dev_light
    name: "Test Light"
    io_device_id: "FEEB1F"
  - platform: home_io_control
    name: "Test Dimmable Light"
    io_device_id: "FEEB21"
    dimmable: true

switch:
  - platform: home_io_control
    name: "Test Switch"
    io_device_id: "FEEB20"
