# Minimal test configuration for home_io_control component
# This provides just enough to compile the component and one entity of each type.
substitutions:
  device_name: test_common

esphome:
  name: ${device_name}
  # The framework-specific test-*.yaml files intentionally restate `substitutions` and `esp32`
  # after `<<: !include common.yaml` (YAML merge keys pick a winner per top-level key rather than
  # deep-merging) — silence the resulting "already defined" noise since that's expected here.
  merge_warnings: false

# Minimal esp32 config; framework (arduino/esp-idf) set in platform-specific files
esp32:
  variant: esp32

logger:
  level: DEBUG

wifi:
  ssid: "test-ssid"
  password: "test12345"

api:

external_components:
  - source:
      type: local
      path: ../components

spi:
  # Heltec WiFi LoRa32 v2 pinout (SX1276)
  clk_pin: 5
  mosi_pin: 27
  miso_pin: 19

home_io_control:
  cs_pin: 18
  rst_pin: 14
  dio0_pin: 26
  radio_type: sx1276
  node_id: C0FFEE
  system_key: 0123456789ABCDEF0123456789ABCDEF
  accept_foreign_pairing: true
  accept_oneway_key: true
  # Two identities: one inheriting the hub system_key with a derived node_id, one with its own
  # key and an explicit address — the two shapes the schema has to support.
  oneway_controllers:
    - id: awning_remote
      io_device_type: awning
      commands: [open, close, stop]
    - id: adopted_neighbour_net
      node_id: A11CE0
      system_key: FEDCBA98765432100123456789ABCDEF
      manufacturer: 0x02
      io_device_type: roller_shutter
      initial_sequence: 1234
      # Exercises the "no commands:" shape too — an identity driven only by the
      # oneway_set_position action still gets its Last 1W Command sensor.
      commands: []

# At least one entity of each type is needed to ensure all platform code compiles
cover:
  - platform: home_io_control
    name: "Test Cover"
    io_device_id: "FEEB1E"
    device_class: awning
    io_device_type: "awning"
    linked_remotes: ["class:awning", "class:0x14"]
    optimistic_state: false

light:
  - platform: home_io_control
    name: "Test Light"
    io_device_id: "FEEB1F"
  - platform: home_io_control
    name: "Test Dimmable Light"
    io_device_id: "FEEB21"
    dimmable: true

switch:
  - platform: home_io_control
    name: "Test Switch"
    io_device_id: "FEEB20"
