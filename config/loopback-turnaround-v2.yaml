## Radio Turnaround Test — V2 (SX1276) Echo/Reply
## Listens for trigger frames from V3, waits a variable delay, then sends a known reply.
## Simulates the device sending 0x3C challenge after receiving 0x31.
## Flash this on V2, flash loopback-turnaround-v3.yaml on V3.

esphome:
  name: turnaround-v2
  friendly_name: Turnaround V2
  platformio_options:
    build_flags:
      - -DIOHOME_FRAME_LOG

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

spi:
  clk_pin: 5
  mosi_pin: 27
  miso_pin: 19

external_components:
  - source:
      type: local
      path: components

home_io_control:
  id: hioc
  cs_pin: 18
  rst_pin: 14
  dio0_pin: 26
  node_id: "C0FFEE"
  system_key: "00112233445566778899AABBCCDDEEFF"

globals:
  - id: echo_active
    type: bool
    initial_value: 'false'
  - id: echo_count
    type: int
    initial_value: '0'

button:
  - platform: template
    name: "Start Echo Mode"
    on_press:
      - lambda: |-
          using namespace esphome::home_io_control;
          id(hioc)->set_radio_test_mode(true);
          auto *radio = id(hioc)->get_radio();
          radio->change_frequency(FREQ_CH2);
          radio->set_mode_rx();
          id(echo_active) = true;
          id(echo_count) = 0;
          ESP_LOGI("turnaround", "========================================");
          ESP_LOGI("turnaround", "  ECHO MODE START — SX1276");
          ESP_LOGI("turnaround", "  Waiting for triggers on CH2...");
          ESP_LOGI("turnaround", "  Reply delays: 10/20/30/50/100ms cycle");
          ESP_LOGI("turnaround", "========================================");

interval:
  - interval: 50ms
    then:
      - lambda: |-
          using namespace esphome::home_io_control;
          if (!id(echo_active)) return;

          auto *radio = id(hioc)->get_radio();
          if (radio == nullptr) return;

          RadioRxPacket packet;
          if (!radio->check_for_packet(packet)) return;

          // Check if it's our trigger frame (CMD=0x31, DST=AABBCC, SRC=C0FFEE)
          if (packet.len < 9) return;
          if (packet.data[8] != 0x31) {
            ESP_LOGD("turnaround", "  (ignoring non-trigger frame, cmd=0x%02X)", packet.data[8]);
            return;
          }

          int count = id(echo_count);
          id(echo_count) = count + 1;

          // Delay schedule: cycle through different reply delays
          static const int DELAYS[] = {10, 20, 30, 50, 100};
          int delay_ms = DELAYS[count % 5];

          ESP_LOGI("turnaround", "  Trigger #%d received! Replying in %dms...", count + 1, delay_ms);

          // Wait the configured delay
          delay(delay_ms);

          // Reply frame: simulates 0x3C challenge (15 bytes)
          // CTRL0=0xCE: END=1,START=1,2W=0, len=15
          static const uint8_t REPLY[] = {
            0xCE, 0x00,
            0xC0, 0xFF, 0xEE,  // DST (V3)
            0xAA, 0xBB, 0xCC,  // SRC (fake device)
            0x3C,              // CMD: challenge
            0x01, 0x02, 0x03, 0x04, 0x05, 0x06  // known challenge bytes
          };

          // Send with SHORT_PREAMBLE (8 bytes) — exactly like a real device would
          RadioTxConfig cfg;
          cfg.freq_hz = FREQ_CH2;
          cfg.preamble_len = 8;
          radio->send_packet(REPLY, sizeof(REPLY), cfg);

          ESP_LOGI("turnaround", "  Reply sent (p8, %d bytes)", sizeof(REPLY));

          // Back to RX for next trigger
          radio->change_frequency(FREQ_CH2);
          radio->set_mode_rx();
