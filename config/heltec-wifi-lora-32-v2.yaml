substitutions:
  device_name: hioc-heltec-v2
  device_friendly_name: Home IO Control WiFi LoRa32 V2

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  build_flags:
    - -DIOHOME_FRAME_LOG
    - -DIOHOME_UNSAFE_LOG_KEY_MATERIAL

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

i2c:
  sda: 4
  scl:
    number: 15
    ignore_strapping_warning: true
  scan: false
  frequency: 400kHz

spi:
  clk_pin:
    number: 5
    ignore_strapping_warning: true
  mosi_pin: 27
  miso_pin: 19

external_components:
  - source:
      type: local
      path: components

font:
  - file: "gfonts://Roboto"
    id: oled_font_small
    size: 12
  - file: "gfonts://Roboto"
    id: oled_font_title
    size: 16

globals:
  - id: oled_last_activity_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: oled_active_cover
    type: std::string
    restore_value: no
    initial_value: '"System"'
  - id: oled_status_text
    type: std::string
    restore_value: no
    initial_value: '"Starting"'

home_io_control:
  cs_pin: 18
  rst_pin: 14
  dio0_pin: 26
  radio_type: sx1276
  node_id: !secret hub_node_id
  system_key: !secret hub_system_key
  exposed_senders:
    - !secret example_io_device_linked_remote_id
  accept_foreign_pairing: true
  recover_oneway_key: true
  oneway_controllers:
    # Design-plan canonical step 14b: the enrollment bench run against the Izymo dimmer.
    # node_id is deliberately omitted -- derived from hub_node_id + this id, printed at boot.
    # manufacturer: 0x02 matches what both the published vector and this project's own real
    # 0x30 captures used; not confirmed to matter to a receiver, but it's the only real-world
    # value on record. Remove this whole block (or enrollment: true) once the bench run is done.
    - id: izymo_dimmer
      io_device_type: light
      manufacturer: somfy
      enrollment: true
      commands: [open, close, stop, favorite]

button:
  - platform: home_io_control
    name: "Discover & Pair"
