substitutions:
  device_name: hioc-esp32c3-bridle-868
  device_friendly_name: Home IO Control ESP32-C3 SuperMini (Bridle 868)

## Home IO Control full hub config for an ESP32-C3 SuperMini driving a Kite radio
## co-processor over a UART (`radio_type: bridle`, 868 MHz io-homecontrol band, `gfsk_raw`).
## UART and reset pins are placeholders in config/boards/esp32c3-supermini-868.yaml.

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  build_flags:
    - -DIOHOME_FRAME_LOG

# Board UART link + Bridle radio settings — single source of truth in config/boards/.
packages:
  board: !include boards/esp32c3-supermini-868.yaml

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # SuperMini antenna quirk: at full TX power the association fails with "Auth Expired".
  output_power: 8.5dB

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      path: components

## PHANTOM DEVICES ONLY: node ids below are made up and bound to no real device, so nothing in
## this file can address a real receiver. The real awning and dimmer stay in
## esp32c3-supermini-bridle.yaml (2.4 GHz) until the 868 bench has been released.
home_io_control:
  node_id: !secret hub_node_id
  system_key: !secret hub_system_key
  discover_and_pair_button: true

cover:
  - platform: home_io_control
    id: patio_awning
    name: "Patio Awning"
    device_class: awning
    io_device_id: !secret example_io_device_id
    io_device_type: "horizontal_awning"
    io_subtype: 0
    invert_position: true
    linked_remotes:
      - !secret example_io_device_linked_remote_id

light:
  - platform: home_io_control
    name: "Dimmable Light"
    io_device_id: !secret example_io_light_device_id
    io_device_type: "light"
    io_subtype: 0
    dimmable: true
