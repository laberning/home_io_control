substitutions:
  device_name: hioc-heltec-v3
  device_friendly_name: Home IO Control WiFi LoRa32 V3

## Home IO Control test config for Heltec WiFi LoRa32 V3.2 (ESP32-S3 + SX1262)
## V3.2 has TCXO at 1.8V, no external PA amplifier (no FEM pins needed).

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  build_flags:
    - -DIOHOME_FRAME_LOG

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

spi:
  clk_pin: 9
  mosi_pin: 10
  miso_pin: 11

external_components:
  - source:
      type: local
      path: components

home_io_control:
  cs_pin: 8
  rst_pin: 12
  dio1_pin: 14
  busy_pin: 13
  radio_type: sx1262
  tcxo_voltage: 1_8V
  node_id: !secret hub_node_id
  system_key: !secret hub_system_key
  exposed_senders:
    - !secret example_io_device_linked_remote_id
  accept_foreign_pairing: true

cover:
  - platform: home_io_control
    id: patio_awning
    name: "Patio Awning"
    device_class: awning
    io_device_id: !secret example_io_device_id
    io_device_type: "horizontal_awning"
    io_subtype: 0
    invert_position: true
    linked_remotes:
      - !secret example_io_device_linked_remote_id

light:
  - platform: home_io_control
    name: "Dimmable Light"
    io_device_id: !secret example_io_light_device_id
    io_device_type: "light"
    io_subtype: 0
    dimmable: true

button:
  - platform: home_io_control
    name: "Discover & Pair"
