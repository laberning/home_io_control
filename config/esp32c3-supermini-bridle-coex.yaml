substitutions:
  device_name: hioc-esp32c3-coex
  device_friendly_name: Home IO Control ESP32-C3 SuperMini (Wi-Fi coexistence bench)

## The Wi-Fi coexistence bench: the answer-delay bench below with the co-processor at its maximum TX power
## (8 dBm, what a user who sets no tx_power gets) and the hub's Wi-Fi signal reported every 10 s.
## The hub side of the answer-delay measurement: an ESP32-C3 SuperMini driving a Kite co-processor
## (the M3 wiring), with one cover that a stand-in device answers (`scripts/bench/io2g4.py respond` on
## a second Kite board). The node ids and the system key below are the bench's own: the key is the
## public key of the test corpus, never a real system's, so nothing here needs a secret.
## The cover is commanded over HTTP (web_server), so no Home Assistant is needed:
##   curl -X POST http://${device_name}.local/cover/Bench%20Cover/open   (or /close, /stop)

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  build_flags:
    - -DIOHOME_FRAME_LOG

packages:
  board: !include boards/esp32c3-supermini.yaml

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # SuperMini antenna quirk: at full TX power the association fails with "Auth Expired".
  output_power: 8.5dB

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

external_components:
  - source:
      type: local
      path: components

home_io_control:
  tx_power: 8  # overrides the board package's 4: the default a user gets
  node_id: "BE0001"
  system_key: "decafc0ffee0ff1cebadbeeff00dba11"

cover:
  - platform: home_io_control
    id: bench_cover
    name: "Bench Cover"
    io_device_id: "BE0D01"
    io_device_type: "roller_shutter"
    low_power: true

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 10s
