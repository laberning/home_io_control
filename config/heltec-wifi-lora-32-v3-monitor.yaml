substitutions:
  device_name: hioc-heltec-v3
  device_friendly_name: Home IO Control WiFi LoRa32 V3 Monitor

## Passive IO-Homecontrol monitor for Heltec WiFi LoRa32 V3.2.
## This config intentionally defines no IO entities and no pairing button.
## The component still keeps the radio in RX, hops channels, and logs parsed traffic.

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  platformio_options:
    build_flags:
      - -DIOHOME_FRAME_LOG

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

spi:
  clk_pin: 9
  mosi_pin: 10
  miso_pin: 11

external_components:
  - source:
      type: local
      path: components

home_io_control:
  cs_pin: 8
  rst_pin: 12
  dio1_pin: 14
  busy_pin: 13
  radio_type: sx1262
  tcxo_voltage: 1_8V
  node_id: !secret hub_node_id
  system_key: !secret hub_system_key
