# expect-error: low_power_wake_ms is ignored by the radio of radio_type: bridle with bridle_band: io_2g4
# covers: tuning.validate_tuning_for_radio
# The wake-up train of the 2.4 GHz band is fixed.
packages:
  common: !include ../_common.yaml

esp32:
  variant: esp32
  framework:
    type: esp-idf

uart:
  id: bridle_uart
  tx_pin: 17
  rx_pin: 16
  baud_rate: 1000000
  rx_buffer_size: 1024

home_io_control:
  radio_type: bridle
  uart_id: bridle_uart
  rst_pin: 4
  bridle_band: io_2g4
  tuning:
    low_power_wake_ms: 600
