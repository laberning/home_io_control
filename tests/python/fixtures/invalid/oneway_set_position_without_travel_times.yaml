# expect-error: has set_position: but no travel times on a cover
# covers: oneway_controllers.validate_oneway_controllers
# A cover's slider value way needs the travel times that make a value possible.
packages:
  common: !include ../_common.yaml
  board: !include ../../../../config/boards/heltec-v3.yaml

home_io_control:
  oneway_controllers:
    - id: remote
      io_device_type: vertical_exterior_awning
      commands: [stop]
      cover: "Awning"
      set_position: timed
