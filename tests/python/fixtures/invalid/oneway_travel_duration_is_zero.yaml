# expect-error: value must be higher than 0s
# covers: oneway_controllers.validate_oneway_controllers
# A run that takes no time has no position to estimate.
packages:
  common: !include ../_common.yaml
  board: !include ../../../../config/boards/heltec-v3.yaml

home_io_control:
  oneway_controllers:
    - id: awning_remote
      io_device_type: vertical_exterior_awning
      commands: [open, close, stop]
      cover: "Awning"
      open_duration: 0s
      close_duration: 22s
