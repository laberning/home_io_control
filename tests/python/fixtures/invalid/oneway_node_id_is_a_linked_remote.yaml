# expect-error: uses node_id AB12CD, which collides with cover 'Awning' linked_remotes
# covers: oneway_controllers._reject_node_id_collision
# Caught at final validation: the colliding address is a linked remote of a cover, outside the hub block. The hub
# would transmit as a remote it is also listening to.
packages:
  common: !include ../_common.yaml
  board: !include ../../../../config/boards/heltec-v3.yaml

home_io_control:
  oneway_controllers:
    - id: remote
      node_id: AB12CD
      io_device_type: vertical_exterior_awning

cover:
  - platform: home_io_control
    name: "Awning"
    io_device_id: "FEEB1E"
    io_device_type: vertical_exterior_awning
    linked_remotes: ["AB12CD"]
