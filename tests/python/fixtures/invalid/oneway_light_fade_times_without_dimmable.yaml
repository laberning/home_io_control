# expect-error: is not dimmable
# covers: oneway_controllers.validate_oneway_controllers
# A fade time estimates a brightness, which a light without a slider does not show.
packages:
  common: !include ../_common.yaml
  board: !include ../../../../config/boards/heltec-v3.yaml

home_io_control:
  oneway_controllers:
    - id: remote
      io_device_type: light
      commands: [stop]
      light: "Lamp"
      on_duration: 5s
      off_duration: 5s
