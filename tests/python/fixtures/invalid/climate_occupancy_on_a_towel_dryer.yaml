# expect-error: occupancy needs a heater with occupancy detection: set io_device_type: electrical_heater, io_subtype: 1 and either no io_model (a radiator) or io_model: heater_with_light
# covers: climate._validate_opt_in_reads
packages:
  common: !include ../_common.yaml
  board: !include ../../../../config/boards/heltec-v2.yaml

climate:
  - platform: home_io_control
    name: "Towel Dryer"
    io_device_id: "4D5E6F"
    io_device_type: electrical_heater
    io_subtype: 1
    io_model: towel_dryer
    occupancy:
      name: "Occupancy"
