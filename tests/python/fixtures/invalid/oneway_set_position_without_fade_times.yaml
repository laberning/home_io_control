# expect-error: has set_position: but no fade times on a light
# covers: oneway_controllers.validate_oneway_controllers
# A slider value way needs the fade times that make a value possible.
packages:
  common: !include ../_common.yaml
  board: !include ../../../../config/boards/heltec-v3.yaml

home_io_control:
  oneway_controllers:
    - id: remote
      io_device_type: light
      commands: [stop]
      light: "Lamp"
      dimmable: true
      set_position: frame
