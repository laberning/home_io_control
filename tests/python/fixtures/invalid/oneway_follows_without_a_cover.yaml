# expect-error: has follows: but neither cover: nor light:
# covers: oneway_controllers.validate_oneway_controllers
# follows: lists the remotes that move the shown state of a cover or a light; without either there is nothing to move.
packages:
  common: !include ../_common.yaml
  board: !include ../../../../config/boards/heltec-v3.yaml

home_io_control:
  oneway_controllers:
    - id: awning_remote
      io_device_type: vertical_exterior_awning
      commands: [open, close, stop]
      follows: [9D6085]
