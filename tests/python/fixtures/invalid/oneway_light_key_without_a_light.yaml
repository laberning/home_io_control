# expect-error: has dimmable: but no light:
# covers: oneway_controllers.validate_oneway_controllers
# dimmable: is a key of the light; without light: there is nothing to apply it to.
packages:
  common: !include ../_common.yaml
  board: !include ../../../../config/boards/heltec-v3.yaml

home_io_control:
  oneway_controllers:
    - id: remote
      io_device_type: light
      commands: [stop]
      dimmable: true
