# expect-error: lr1121_rx_bandwidth is ignored by the radio of radio_type: bridle with bridle_band: io_868
# covers: tuning.validate_tuning_for_radio
# The bridge reads the SX1262 bandwidth key only.
packages:
  common: !include ../_common.yaml

esp32:
  variant: esp32
  framework:
    type: esp-idf

uart:
  id: bridle_uart
  tx_pin: 17
  rx_pin: 16
  baud_rate: 1000000
  rx_buffer_size: 1024

home_io_control:
  radio_type: bridle
  uart_id: bridle_uart
  rst_pin: 4
  bridle_band: io_868
  tuning:
    lr1121_rx_bandwidth: "117.3"
