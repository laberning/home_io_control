# expect-error: start_preamble_ms is ignored by the radio of radio_type: bridle with bridle_band: io_2g4
# covers: tuning.validate_tuning_for_radio
# A wake-up on 2.4 GHz is a train of frames; no preamble length changes it.
packages:
  common: !include ../_common.yaml

esp32:
  variant: esp32
  framework:
    type: esp-idf

uart:
  id: bridle_uart
  tx_pin: 17
  rx_pin: 16
  baud_rate: 1000000
  rx_buffer_size: 1024

home_io_control:
  radio_type: bridle
  uart_id: bridle_uart
  rst_pin: 4
  bridle_band: io_2g4
  tuning:
    start_preamble_ms: 10
