# expect-error: sx1262_rx_bandwidth is ignored by the radio of radio_type: bridle with bridle_band: io_2g4
# covers: tuning.validate_tuning_for_radio
# An 802.15.4 radio has no GFSK receiver bandwidth: the key is rejected on the 2.4 GHz band, not ignored.
packages:
  common: !include ../_common.yaml

esp32:
  variant: esp32
  framework:
    type: esp-idf

uart:
  id: bridle_uart
  tx_pin: 17
  rx_pin: 16
  baud_rate: 1000000
  rx_buffer_size: 1024

home_io_control:
  radio_type: bridle
  uart_id: bridle_uart
  rst_pin: 4
  bridle_band: io_2g4
  tuning:
    sx1262_rx_bandwidth: "117.3"
