# expect-error: has open_duration: and close_duration: but no cover:
# covers: oneway_controllers.validate_oneway_controllers
# The travel times belong to the cover entity; without it there is nothing to estimate.
packages:
  common: !include ../_common.yaml
  board: !include ../../../../config/boards/heltec-v3.yaml

home_io_control:
  oneway_controllers:
    - id: awning_remote
      io_device_type: vertical_exterior_awning
      commands: [open, close, stop]
      open_duration: 24s
      close_duration: 22s
