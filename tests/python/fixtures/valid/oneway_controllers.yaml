# expect: valid
# A derived-address identity and an explicit one with its own key and an enrollment button.
packages:
  common: !include ../_common.yaml
  board: !include ../../../../config/boards/heltec-v3.yaml

home_io_control:
  oneway_controllers:
    - id: awning_remote
      io_device_type: vertical_exterior_awning
      commands: [open, close, stop]
    - id: screen_remote
      node_id: A11CE0
      system_key: FEDCBA98765432100123456789ABCDEF
      manufacturer: velux
      io_device_type: vertical_exterior_awning
      commands: [stop]
      enrollment: true
      enrollment_classes: [vertical_exterior_awning, roller_shutter]
    # An inverted kind mirrors open/close by default; the key switches that off.
    - id: patio_remote
      io_device_type: horizontal_awning
      commands: [open, close, stop]
    - id: patio_remote_raw
      io_device_type: horizontal_awning
      invert_position: false
      commands: [open, close]
    - id: patio_remote_all
      io_device_type: horizontal_awning
      execute_broadcast: all
      commands: [open, close]
