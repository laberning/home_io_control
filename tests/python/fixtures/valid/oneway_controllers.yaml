# expect: valid
# A derived-address identity and an explicit one with its own key and an enrollment button, and every optional
# one-way key: execute_acei, low_power in both values, initial_sequence, invert_position, drives,
# cover, light and follows.
packages:
  common: !include ../_common.yaml
  board: !include ../../../../config/boards/heltec-v3.yaml

home_io_control:
  oneway_controllers:
    - id: awning_remote
      io_device_type: vertical_exterior_awning
      commands: [open, close, stop]
      # The hub follows its own commands on these devices, a cover and a light, like a linked remote's press.
      drives: [A1B2C3, "d4e5f6"]
    # An assumed-state cover for the identity, following two real remotes (ADR 0117). An inverted kind needs nothing
    # more: the mirror is read from the kind.
    - id: patio_cover_remote
      io_device_type: horizontal_awning
      commands: [open, close, stop]
      cover: "Patio"
      follows: [9D6085, "aabbcc"]
    # The same cover with its travel times, so that it estimates a position (ADR 0127).
    - id: patio_timed_remote
      io_device_type: vertical_exterior_awning
      commands: [open, close, stop]
      cover: "Patio Timed"
      follows: [9D6085]
      open_duration: 24s
      close_duration: 22.5s
    # The same cover's slider with a position frame instead of the timed stop (ADR 0128).
    - id: patio_frame_remote
      io_device_type: vertical_exterior_awning
      commands: [open, close, stop]
      cover: "Patio Frame"
      open_duration: 24s
      close_duration: 22.5s
      set_position: frame
    # A light for the identity (ADR 0128): a binary one, and a dimmable one with fade times and each slider way.
    - id: lamp_binary_remote
      io_device_type: light
      commands: [open, close]
      light: "Lamp"
      follows: [9D6085]
    - id: lamp_timed_remote
      io_device_type: light
      commands: [open, close, stop]
      light: "Lamp Timed"
      dimmable: true
      on_duration: 4.7s
      off_duration: 4.7s
    - id: lamp_frame_remote
      io_device_type: light
      commands: [open, close, stop]
      light: "Lamp Frame"
      dimmable: true
      on_duration: 4.7s
      off_duration: 4.7s
      set_position: frame
    - id: screen_remote
      node_id: A11CE0
      system_key: FEDCBA98765432100123456789ABCDEF
      manufacturer: velux
      io_device_type: vertical_exterior_awning
      commands: [stop]
      enrollment: true
      enrollment_classes: [vertical_exterior_awning, roller_shutter]
    # An inverted kind mirrors open/close by default; the key switches that off.
    - id: patio_remote
      io_device_type: horizontal_awning
      commands: [open, close, stop]
    - id: patio_remote_raw
      io_device_type: horizontal_awning
      invert_position: false
      commands: [open, close]
    - id: patio_remote_all
      io_device_type: horizontal_awning
      execute_broadcast: all
      commands: [open, close]
    # Every optional key at once: a fixed EXECUTE ACEI, an enrollment whose add frame carries the MAC trailer, the
    # low-power wake-up shape, a counter seed, and a mirror on a kind that is not inverted by default.
    - id: gate_remote
      node_id: B0B0B0
      io_device_type: roller_shutter
      commands: [open, close, stop]
      manufacturer: somfy
      enrollment: true
      execute_acei: 0x43
      low_power: true
      initial_sequence: 1000
      invert_position: true
    # low_power: false: the normal start preamble on every copy.
    - id: lamp_remote
      node_id: B1B1B1
      io_device_type: roller_shutter
      commands: [stop]
      low_power: false

cover:
  - platform: home_io_control
    name: "Awning"
    io_device_id: "A1B2C3"
    io_device_type: vertical_exterior_awning

light:
  - platform: home_io_control
    name: "Dimmer"
    io_device_id: "D4E5F6"
    io_device_type: light
    dimmable: true
