# expect: valid
# A Bridle co-processor over a UART: no spi: bus, no chip pins, a tx_power the co-processor clamps to its radio.
packages:
  common: !include ../_common.yaml

esp32:
  variant: esp32
  framework:
    type: esp-idf

uart:
  id: kite_uart
  tx_pin: 17
  rx_pin: 16
  baud_rate: 1000000
  rx_buffer_size: 1024

home_io_control:
  radio_type: bridle
  uart_id: kite_uart
  rst_pin: 4
  bridle_band: io_2g4
  bridle_trace: false
  tx_power: 4
