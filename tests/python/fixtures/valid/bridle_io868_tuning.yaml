# expect: valid
# The 868 MHz bridge takes the SX1262 bandwidth and discovery slice and every preamble duration; its entities exist.
packages:
  common: !include ../_common.yaml

esp32:
  variant: esp32
  framework:
    type: esp-idf

uart:
  id: bridle_uart
  tx_pin: 17
  rx_pin: 16
  baud_rate: 1000000
  rx_buffer_size: 1024

home_io_control:
  radio_type: bridle
  uart_id: bridle_uart
  rst_pin: 4
  bridle_band: io_868
  tuning:
    ui_controls: true
    sx1262_rx_bandwidth: "117.3"
    sx1262_discovery_hop_slice_ms: 10
    start_preamble_ms: 10
    low_power_wake_ms: 600
    response_preamble_ms: 3.5
