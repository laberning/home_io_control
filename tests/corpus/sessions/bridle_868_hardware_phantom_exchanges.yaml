  recorded_by: 'Bench 2026-10-24: an ESP32-C3 host (config/esp32c3-supermini-bridle-868-phantom.yaml)
    over the UART to a XIAO nRF52840 with a Wio-SX1262 (Kite 0.0.0-dev+g1ba8ce2)'
  description: 'Boot of the 868 MHz co-processor and four exchanges to phantom devices that never answer:
    a name request and a status request to an always-alive node behind the 48-byte preamble, a name request
