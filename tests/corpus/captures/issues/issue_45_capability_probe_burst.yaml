id: issue_45_capability_probe_burst
description: >
  Full 0x58/0x4B capability-probe burst from a real Velux KIG300 hub against two Somfy Izymo
  dimmers (586E36, 586E37) — kept whole rather than trimmed to the two unknown opcodes, because
  its value is showing a real hub's probe sequence *and* how lossy the capture is. One frame from
  the source burst is deliberately omitted: 29 ms after the GET_NAME (0x50) request below, the
  source log shows a truncated GET_NAME_RESP reply (10 of its declared 25 bytes) — a partial
  reception that cannot be represented here, since every corpus frame's captured byte count must
  agree with its own CTRL0 length field (tests/corpus/README.md; parser robustness against
  truncated input is covered directly by ProtoFrame.ParseRejectsNullAndTruncatedInputs instead).
source:
