    hex: "98 00 CA 0A 18 58 6E 37 57 35 31 36 35 39 34 38 41 30 31 03 C0 03 00 00 00"
    crc: absent
    note: >
      cmd=GET_INFO2_RESP(0x57). No captured GET_INFO2 request precedes it. Human-verified decode:
      data[10]=0x03, data[11]=0xC0 -> (0x03<<2)|(0xC0>>6) = 0x0F = ON_OFF_SWITCH via
      decode_packed_device_type() (proto_device_model.cpp), matching the human-readable "Light"
      name the sibling 586E36 returns in its GET_NAME_RESP above in the same burst. This device
      (586E37) is the one that goes on to answer 0x4B (twice, below) and refuses 0x0C (twice,
      below) rather than answering it — the ON_OFF_SWITCH/motor-type split this whole burst is
      evidence for.
  - dir: rx
