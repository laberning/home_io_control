id: issue_60_tilt_status_poll_reports_settled_tilt_after
description: >
  The "after" half of the same-device before/after pair (see
  issue_60_tilt_status_poll_reports_settled_tilt_before.yaml and
  issue_60_tilt_execute_ack_echoes_precommand_tilt.yaml): a status poll one minute after the
  reporter set tilt to 75% (from a 0% baseline). The extended CMD_PRIVATE_RESP's tilt block at
  data[12..14] is now 0x372C -> decode_tilt_report(0x372C) = 72.4%, rounding to 72 — close to
  the commanded 75% (small deviation plausibly genuine mechanical settling, not a decode bug)
  and clearly distinct from both the 0% pre-command baseline and the unrelated bogus 16%-ish
  reading the EXECUTE ack's own tilt-shaped bytes produce. This is the real-hardware evidence
  that the extended status-poll tilt field (decode_status_fields()'s
  allow_tilt_from_extended_response branch in hub_status.cpp, gated on data_len>=15 and
  data[12]==STATUS_TILT_SELECTOR) is trustworthy and tracks the actual slat angle over time —
  before this capture, that code path had no real-hardware corpus coverage at all, only the
  bogus-value EXECUTE-ack case.
