id: issue_60_tilt_execute_ack_echoes_precommand_tilt
description: >
  Middle frame of the same-device before/after pair (see
  issue_60_tilt_status_poll_reports_settled_tilt_before.yaml and
  issue_60_tilt_status_poll_reports_settled_tilt_after.yaml): the reporter set tilt from a known
  0% baseline to 75% (data[5..6] of the EXECUTE request = 0x3200 -> 100 - 12800*100/51200 =
  75%, matching "Sending tilt=75%"). The immediate 0x04 ack's tilt-shaped bytes at data[5..6]
  are 0xC800 — decode_tilt_report(0xC800) = 0%, i.e. **byte-for-byte identical** to the raw tilt
  block this same device reported in the status poll one minute *before* this command (see the
  "before" capture). That exact match is the answer to the maintainer's open question on issue
  #60: the EXECUTE-tilt ack's tilt block is the device's *pre-command* angle, not the new
  target and not a live in-motion reading — it hadn't started moving yet when it built this
  reply. hub_status.cpp never decodes this value (trust_position=false for our own EXECUTE
  acks, and even when trusted the offsets differ from the extended status-poll layout — see the
  file-scope comment above PRIVATE_RESPONSE_TARGET_OFFSET), so no code change follows from this
  capture; it exists to document *why* leaving that field permanently unused is correct, with
  real-hardware evidence, rather than an untested assumption.
  Also note data[2..3]=0xC800 (target=100%) and the generic current-position decode data[4..5]:
  data[4]=0x20 is the tilt selector marker reused as if it were the current-position MSB, giving
  a bogus 16%-ish reading — the same artifact documented in
  issue_60_tilt_execute_ack_tilt_block.yaml, reproduced here on a third capture of the same bug
  class with a different commanded tilt value.
