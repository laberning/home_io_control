id: somfy_smoove_oneway_write_private_a
description: >
  1W CMD_WRITE_PRIVATE (0x20) broadcast from the same Somfy Smoove-style io wall switch as
  somfy_smoove_oneway_execute_current, captured immediately after the CMD_EXECUTE frame in that
  file. Sub-payload differs from the favorite/'My'-button pattern seen in somfy_awning's own
  oneway_remote_favorite_sx1276 capture (byte 5 and bytes 6-7 differ) — likely a different
  physical control on this device, but the exact semantics are not verified, so only structural
  fields are asserted. Same source and license as oneway_execute_current.yaml
  (Velocet/iown-homecontrol docs/radio.md, CC0-1.0).
  Literal documented bytes with only a preamble/sync prefix stripped; crc_ccitt() independently
  confirms the trailing CRC.
