id: somfy_izymo_dimmer_exchange_on_sx1262
description: >
  Turn-on command (light.turn_on) issued to the Izymo dimmer over the Heltec V3/SX1262 hub —
  the sx1262 sibling of somfy_izymo_dimmer_exchange_on_sx1276.yaml, same EXECUTE shape, position=0 (raw). See that
  capture's note for why the light platform reuses the plain cover-position EXECUTE command
  rather than a distinct dimmer/brightness command.
source:
  device: "Somfy Izymo dimmer (io light actuator)"
  captured_with: sx1262
  firmware: null
  date: 2026-08-03
  origin: own-hardware
  issue: null
key: corpus
frames:
  - dir: tx
    t_ms: 0
    freq: 868950000
    hex: "50 20 53 0B D0 C0 FF EE 00 01 43 00 00 80 D8 06 00"
    crc: absent
    note: "cmd=EXECUTE(0x00)"
  - dir: rx
    t_ms: 0
    freq: 868950000
    hex: "0E 00 C0 FF EE 53 0B D0 3C AD B5 AC CC 66 EC"
    crc: absent
    note: "cmd=CHALLENGE_REQ(0x3C)"
  - dir: tx
    t_ms: 30
    freq: 868950000
    hex: "0E 20 53 0B D0 C0 FF EE 3D 4C A2 D6 AC 8E 6A"
    crc: absent
    note: "cmd=CHALLENGE_RESP(0x3D); rekeyed under the public corpus key"
  - dir: rx
    t_ms: 30
    freq: 868950000
    hex: "90 00 C0 FF EE 53 0B D0 04 2C 00 C8 00 80 D8 06 00"
    crc: absent
    note: "cmd=PRIVATE_RESP(0x04); quick EXECUTE-ack, same stale/untrustworthy shape as somfy_izymo_dimmer_exchange_on_sx1276.yaml's ack — target/current decode to 100%/64%, not the just-commanded ON, and bytes 4-7 (80 D8 06 00) are an exact echo of the outbound EXECUTE frame's own trailing bytes, not real telemetry. Not asserted in expect: below for that reason; the real settled value arrives on the follow-up status poll (see somfy_izymo_dimmer_statuspoll_light_on_sx1262.yaml)."
expect:
  exchange:
    kind: authenticated_command
    outcome: success
  frames:
    - {cmd: 0x00, start: true, end: false, protocol: 2w}
    - {cmd: 0x3C, start: false, end: false, protocol: 2w, classification: REQUIRE_AUTH}
    - {cmd: 0x3D, start: false, end: false, protocol: 2w, hmac_valid: true}
    - {cmd: 0x04, start: false, end: true, protocol: 2w, classification: ACCEPT}
