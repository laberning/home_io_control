id: tilt_cover_exchange_ack_tilt_block_second_device
description: >
  Sibling of tilt_cover_exchange_ack_tilt_block.yaml, captured ~370 ms later in the same
  Home Assistant action: the identical EXECUTE-tilt (tilt=83%) sent to a second cover on the same
  hub. Its 0x04 ack carries data[4..6] = 20 64 00 where the first device carried 20 60 8D — a
  visibly different payload that decodes to the same 16% "position", because the constant 0x20
  read as the current-position MSB dominates. This is what makes the pair conclusive: a real
  position field would not be pinned to 0x20xx across two independently-positioned covers.
  `reported_position: 16` records that raw decode, not a human-verified device position.
source:
  device: "io-homecontrol tilt-capable cover (cover_position_tilt profile), node 7F5958"
  captured_with: other
  firmware: "user build at commit 03b5f8d (log lines home_io_control:245/:269)"
  date: 2026-08-11
  origin: github-issue
  issue: "https://github.com/laberning/home_io_control/issues/60"
key: unknown
frames:
  - dir: tx
    t_ms: 0
    freq: 868950000
    hex: "50 20 7F 59 58 31 BA F7 00 01 43 D4 00 20 22 00 00"
    crc: absent
    note: "cmd=EXECUTE(0x00) setOrientation, START; identical payload to the sibling capture — main0=0xD4 POS_UNKNOWN, data[5..6]=0x2200 = tilt 83%"
  - dir: rx
    t_ms: 290
    freq: 868950000
    hex: "0E 00 31 BA F7 7F 59 58 3C 65 05 F5 F3 17 E7"
    crc: absent
    note: "cmd=CHALLENGE_REQ(0x3C), challenge = 65 05 F5 F3 17 E7"
  - dir: tx
    t_ms: 298
    freq: 868950000
    hex: "0E 00 7F 59 58 31 BA F7 3D 0C 2D 4C 5C DD 93"
    crc: absent
    note: "cmd=CHALLENGE_RESP(0x3D), HMAC under the reporter's real system key — not verifiable here (key: unknown)"
  - dir: rx
    t_ms: 332
    freq: 868950000
    hex: "90 00 31 BA F7 7F 59 58 04 04 80 C8 00 20 64 00 00"
    crc: absent
    note: "cmd=PRIVATE_RESP(0x04) EXECUTE-tilt ack, END — data[4..6] = 20 64 00 (selector + tilt block); read as a position, data[4..5] = 0x2064 = 16.2%, the same 16% the sibling's 0x2060 gives"
expect:
  exchange:
    kind: authenticated_command
    outcome: success
  frames:
    - {cmd: 0x00, start: true, end: false, protocol: 2w}
    - {cmd: 0x3C, start: false, end: false, protocol: 2w, classification: REQUIRE_AUTH}
    - {cmd: 0x3D, start: false, end: false, protocol: 2w}
    - {cmd: 0x04, start: false, end: true, protocol: 2w, classification: ACCEPT}
  device:
    reported_position: 16  # raw decode of data[4..5]; the bug, not the device's real position — see description
