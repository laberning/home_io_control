id: velux_sml_exchange_execute_ack_waiting_for_power_sx1262
description: >
  The reply of a VELUX SML roller shutter to the hub's own set-position EXECUTE (75 %), issue #230.
  The shutter shares a KUX 110 power supply with a second SML shutter that was idle. Its CMD_PRIVATE_RESP
  acknowledgement carries status byte 03 = (0 << 3) | 3: state 3, waiting for power, although nothing else
  moved. The six status reads that follow, 3 s apart, report state 4 (executing) with a falling remaining
  time while the shutter runs from 0 % to 75 %, then state 5 (done) at 75 %. So an acknowledgement with
  state 3 says nothing about a queue; only a status read does.
  The EXECUTE is the 8-byte form with the speed block, and the shutter answers it with result code 0:
  unlike the other devices in the corpus it does not call a parameter unknown.
  The 0x3C CHALLENGE_REQ and the hub's 0x3D response between the two frames are omitted: their payloads
  are masked by this project's own redaction before the log is written. The position bytes of the
  acknowledgement (target and current 00 00 here, the 75 % the command asked for is in the EXECUTE) are not
  decoded by the hub. t_ms are from the log line timestamps (TX at 09:16:40.965).
