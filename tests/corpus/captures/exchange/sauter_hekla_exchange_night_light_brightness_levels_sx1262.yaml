id: sauter_hekla_exchange_night_light_brightness_levels_sx1262
description: >
  The four night-light brightness levels of a Sauter Hekla electric heater (type 52 subtype 1), set on the
  heater's own panel and overheard by the hub. The heater's controller node (F23FA9) writes register 0x0142
  to the Cozytouch (A34A4F) with an authenticated CMD_WRITE_PRIVATE (0x20) `0C 61 01 42 <u16 little-endian>`:
  0x0064 (100) for the lowest level, 0x03E8 (1000), 0x07D0 (2000) and 0x2710 (10000) for the highest. The
  brightness register therefore runs 0-10000. The four writes come from separate log excerpts, ordered by
  the hub's capture timestamp (level 2, 3, 1, 4); t_ms is the difference of those timestamps, and the
  excerpts may span a hub restart, so the spacing carries no meaning. No challenge or acknowledgement
  frames were logged.
