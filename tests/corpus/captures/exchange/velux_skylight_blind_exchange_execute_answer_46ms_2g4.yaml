id: velux_skylight_blind_exchange_execute_answer_46ms_2g4
description: >
  A bench tool sends an authenticated EXECUTE (originator 1, ACEI 0x63, main parameter 0x0000, open) as node C0FFEE to a VELUX skylight blind 516B10, behind the long wake train. The blind challenges it (0x3C); the bench tool answers with the 0x3D exactly 46 ms after the challenge's last bit (the answer is timed by the co-processor, tx.t_main_us), and the blind accepts it and sends the short 0x04. 46 ms is the longest answer delay at which this blind was seen to accept; at 47 ms it ignores the answer (the sibling capture). The request, its train and the answer are the bench tool's commanded ones, the challenge and the 0x04 are received. The 0x3D is re-keyed to the corpus key.
