id: somfy_pergola_louver_exchange_open_close_position_stop_sx1262
description: >
  A hub session against a Somfy bioclimatic pergola (io type 0x1D, louvre opening as the main
  parameter), PR #157 (@piitaya): open, close, set position 50, open again and STOP, Heltec V3
  hub 9AF3CE with sx1262_rx_bandwidth 156.2 on CH2, recorded by a second Heltec V3 (SX1262)
  sniffer locked on CH2. Main parameter 0x0000 is open and 0xC800 closed, no inversion; the hub
  logged the pergola stopped at 0, 100, 51 and 31 % at the end of the four moves. The sniffer
  drops frames that follow another frame too closely, so it caught one device reply (the STOP
  ack) and none of the poll replies; the hub's own log decoded them and is quoted in each note.
  The 0x3C/0x3D frames are masked in the source log, so every challenge and challenge response
  is omitted and this excerpt is not a replayable exchange. t_ms are the sniffer's timestamps
  relative to the first frame. The device's own 0x04 replies are in
  tests/corpus/captures/statuspoll/somfy_pergola_louver_statuspoll_replies_sx1262.yaml and
  tests/corpus/captures/exchange/somfy_pergola_louver_exchange_execute_acks_sx1262.yaml, and its
  identity in tests/corpus/captures/probe/somfy_pergola_louver_probe_get_info2_sx1262.yaml.
