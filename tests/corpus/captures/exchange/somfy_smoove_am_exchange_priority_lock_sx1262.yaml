id: somfy_smoove_am_exchange_priority_lock_sx1262
description: >
  The hub's execute_priority probe (a STOP, main parameter D2) sent three times to a Somfy roller
  shutter motor wired to a Smoove Uno io A/M switch. With the switch on A, the STOP at ACEI 0xE7
  (level 7) is taken (PRIVATE_RESP). With the switch on M, the same STOP at level 7 is refused with
  ERROR_RESP FE 38 (PRIORITY_LOCKED), and the STOP at ACEI 0x47 (level 2) is taken. The status
  payload of both PRIVATE_RESP replies is identical, so the lock shows only in the answer to a
  level-7 command. Three complete authenticated exchanges, one per probe.
