id: atlantic_calypso_exchange_register_read
description: >
  An Atlantic Calypso Connecte 200 L heat-pump water heater (node F9CF0F, type 51 subtype 0) answering
  `register_00` reads `0C 60 00 <index>` from the reporter's SX1276 hub C0FFEE (issue #198, comments of
  2026-11-03, 2026-11-06, 2026-11-08 and 2026-11-13). Each answer is CMD_WRITE_PRIVATE_ACK (0x21) echoing the four header bytes,
  then the value, big-endian. Only the answers were logged (the probe's `index=` lines); the requests are
  not in this capture, and the reads were not challenged.

  What the frames show, with what the display said at the time:
    - 0x0017 water temperature, first two value bytes signed tenths: 01 F0 = 49.6 C (run A), 02 45 =
      58.1 C (boost run); the four bytes after them never changed.
    - 0x0006 mode: 00 in AUTO, 01 in manual with ECO on (54 C, 4 showers), 02 in manual with ECO off
      (62 C, 5 showers).
    - 0x0021 what is heating: idle 00 FF 00 00 00 ..., heat pump running 01 FF 00 01 01 ..., boost
      (heat pump and electric element) 01 FF 01 01 01 ...
    - 0x0004 energy since installation, 32-bit Wh: 00 1B F3 42 = 1 831 746 Wh, the display's
      "since start" 1 831 kWh; 00 1B F3 97 after the heat pump ran.
    - 0x0000 boost duration: 01 while a boost started on the display ran, 00 otherwise (the unit is not
      known; ADR 0081 reads the boost state from the operating-mode word, not from here).
    - 0x0005 holiday duration, the days the holiday still runs: 00 at rest with a holiday scheduled for
      later, 02 two days and 04 four days before the end, FF for a holiday set with no end date.
    - 0x0007 brand letter: 41 ('A').

  Community capture: no system key, and no authenticated bytes are included.
