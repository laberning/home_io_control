id: somfy_awning_exchange_ack_reports_stale_target_open
description: >
  The device's immediate reply to an EXECUTE(open, target=25%) command carries a stale target of
  0% — its pre-command position — instead of the just-commanded 25%. Both the target bytes
  (data[2..3] = 00 00) and the current bytes (data[4..5] = 00 00) read zero here, so
  `reported_position` is 0. The true value only arrives on the follow-up status polls, which
  reported 3%, 6%, 10% ... in the same session.
  Recorded back-to-back with somfy_awning_exchange_ack_reports_stale_target_close.yaml, and the pair is the
  point: there the device is commanded to 0% and its ack's target reads 25%. Each ack echoes the
  *other* scenario's pre-command value, which rules out a fixed-offset decode error on our side
  and pins the behaviour as the device reporting pre-command state — this capture alone could be
  explained by an all-zero payload, the sibling is what makes it conclusive.
