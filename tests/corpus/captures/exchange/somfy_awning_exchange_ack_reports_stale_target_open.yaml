  - dir: rx
    t_ms: 315
    freq: 868950000
    hex: "8E 00 C0 FF EE 30 E1 F2 04 2C 80 00 00 00 00"
    crc: absent
    note: "cmd=PRIVATE_RESP(0x04), quick EXECUTE-ack, END — target bytes 00 00 and current bytes 00 00 both decode to 0%, the stale pre-command state, not the just-commanded target=25"
