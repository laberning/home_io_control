    kind: authenticated_command
    outcome: success
  frames:
    - {cmd: 0x00, start: true, end: false, protocol: 2w}
    - {cmd: 0x3C, start: false, end: false, protocol: 2w, classification: REQUIRE_AUTH}
    - {cmd: 0x3D, start: false, end: false, protocol: 2w}
    - {cmd: 0x04, start: false, end: true, protocol: 2w, classification: ACCEPT}
