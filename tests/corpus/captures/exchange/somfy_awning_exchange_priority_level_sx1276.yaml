id: somfy_awning_exchange_priority_level_sx1276
description: >
  First real-world capture of CMD_PRIORITY_LEVEL_REQ (0x19) this project has seen: no builder, no
  dispatch handler and no earlier corpus entry of any kind. A real Somfy TaHoma Switch (node 7B0490)
  sent it directly to a real Sunea io screen (node B18635) it already owns. It is part of the same
  session as the wind_sensor_oneway_favorite_*_originator_sx1276.yaml captures, and the reporter's
  installation also has a combined wind/rain station. Only the request is captured. The reporter's
  log did not include the CMD_CHALLENGE_REQ (0x3C) the device would send in response, nor any
  CMD_PRIORITY_LEVEL_RESP (0x1A), so this is a deliberately partial capture: it records the
  command's existence and shape, not a full round trip. The shape is a single-byte payload, 0x02
  and then 0x04 ~212 ms apart (the 0x02 repeats are not included here). A payload that steps
  through values rather than repeating one reads as a walk over io-homecontrol priority levels, a
  per-level lock query, which is why the opcode is named that way now. An earlier name filed it as
  "inject sensor value", with no more evidence than this. Unconfirmed until a reply is captured.
  If it is a lock query, it is also a candidate for reading a rain or wind lock back out of a device
  (issue #98). Community capture from issue #27 (Skamba).
source:
  device: "Somfy Sunea io screen (node B18635), directed write from a real Somfy TaHoma Switch
    (node 7B0490) that already owns it"
  captured_with: sx1276
  firmware: "ESPHome 2026.8.2 / home_io_control main, LilyGO T3 LoRa32 V1.6.1"
  date: 2026-09-04
  origin: github-issue
  issue: https://github.com/laberning/home_io_control/issues/27
key: unknown
frames:
  - dir: rx
    t_ms: 0
    freq: 869850000
    hex: "49 00 B1 86 35 7B 04 90 19 04"
    crc: absent
    note: "cmd=PRIORITY_LEVEL_REQ(0x19), 1-byte payload 0x04. Two earlier repeats of the same command
      carrying payload 0x02 (on the other two channels, ~212ms before this one) are not included
      here -- same shape, redundant to keep both."
expect:
  frames:
    - {cmd: 0x19, start: true, end: false, protocol: 2w}
