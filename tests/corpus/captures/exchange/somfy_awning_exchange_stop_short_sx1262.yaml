id: somfy_awning_exchange_stop_short_sx1262
description: >
  Sunea awning stop, sent 4 s after an open command while the awning was extending (from fully closed),
  sent in the 6-byte main-parameter EXECUTE form (originator, ACEI, main parameter, two zero bytes; no
  FP1 speed block), the form the hub sends to covers without a chosen travel speed (ADR 0065). The
  awning is a horizontal awning configured with invert_position, so IO position 0 is retracted and the
  Home Assistant position equals the IO position. Own bench, Heltec WiFi LoRa 32 V3 (sx1262). The
  answer's byte 0 is 0x05: result code 0 in bits 7..3, execution state 5 in bits 2..0. A stop in the
  6-byte form with ACEI 0x43, main parameter 0xD200
  (tests/corpus/captures/exchange/somfy_awning_exchange_stop_sx1262.yaml), is answered with code 0 (byte
  0 0x05). The hub's follow-up status reads polled the awning while it moved; the last, 1.3 s after the
  command, reported execution done (status byte 0x05) at current position raw 0x15D6 (10.9 %, Home
  Assistant position 11 %), where it stopped. Frame bytes come from the hub's frame log; the 0x3C/0x3D
  payloads, which that log masks, and the timestamps (start of each burst on air) come from an SDR
  receiver recording the same exchange, CRC-checked; every unmasked byte agreed between the two.
