id: tilt_cover_exchange_ack_tilt_block
description: >
  The device's immediate 0x04 reply to an EXECUTE-tilt command (setOrientation, tilt=83%) uses a
  *different payload layout* than a position status reply: data[4] is the tilt selector 0x20 and
  data[5..6] are a 16-bit tilt value, where a position-bearing 0x04 has the current position in
  data[4..5]. The generic decode therefore reads current_raw = 0x2060 and reports 16% — a value
  that comes from the selector byte, not from the device's real position (Home Assistant showed
  it as 84%, the inverted form). `reported_position: 16` below records that raw decode as the
  artifact it is; it is **not** a human-verified device position.
  Recorded back-to-back with tilt_cover_exchange_ack_tilt_block_second_device.yaml, and the
  pair is the point: the same tilt=83% command to a second cover returns data[4..6] = 20 64 00
  instead of 20 60 8D, so the two decode to 16.2% and 16.2% — indistinguishable positions from
  visibly different payloads. That rules out "both covers happened to be at 16%" and pins the
  constant 0x20 high byte as a layout marker rather than a position MSB.
  Note the tilt block does not echo the commanded tilt either: 0x608D and 0x6400 decode to ~52%
  and 50%, not the commanded 83% — the ack carries in-flight state, not the new setpoint.
  The reporter's build predates commit 5aaf1e8 ("stop trusting stale target/position in EXECUTE's
  own reply"), which stops applying data[2..5] from an EXECUTE ack at all; this capture is the
  regression fixture for the decode itself.
