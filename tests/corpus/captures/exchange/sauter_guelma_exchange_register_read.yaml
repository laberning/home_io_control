id: sauter_guelma_exchange_register_read
description: >
  A Sauter Guelma connecte 80 L electric storage water heater (type 51 subtype 0) answering `register_00` reads
  `0C 60 00 <index>` in automatic mode, manual mode, absence and boost, at rest and while heating. Each answer is
  CMD_WRITE_PRIVATE_ACK (0x21) echoing the four header bytes, then the value, big-endian; only the answers were
  logged. The node IDs are remapped. What each frame shows, with what the display said, is in its note.
