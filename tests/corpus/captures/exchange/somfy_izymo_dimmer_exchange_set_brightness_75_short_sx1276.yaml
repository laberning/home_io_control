id: somfy_izymo_dimmer_exchange_set_brightness_75_short_sx1276
description: >
  Izymo dimmer brightness 75 %, sent in the 6-byte main-parameter EXECUTE form (originator, ACEI, main
  parameter, two zero bytes; no FP1 speed block), the form the hub sends to lights and to covers
  without a chosen travel speed (ADR 0065). Own bench, Heltec WiFi LoRa 32 V2 (sx1276). The answer's byte 0 is
  0x04: result code 0 in bits 7..3, execution state 4 in bits 2..0. The same command
  in the 8-byte form with the speed block is answered with code 5 (compare
  tests/corpus/captures/exchange/somfy_izymo_dimmer_exchange_set_brightness_75_sx1276.yaml). The hub's
  follow-up status read 3 s later reported the dimmer at brightness 75 % (current position raw
  0x3200), the level commanded. Frame bytes come from the hub's frame log; the
  0x3C/0x3D payloads, which that log masks, and the timestamps (start of each burst on air) come
  from an SDR receiver recording the same exchange, CRC-checked; every unmasked byte agreed between
  the two.
source:
  device: "Somfy Izymo dimmer (io light actuator)"
  captured_with: sx1276
  firmware: "main cb24b94 plus the short-EXECUTE change"
  date: 2026-11-14
  origin: own-hardware
  issue: null
