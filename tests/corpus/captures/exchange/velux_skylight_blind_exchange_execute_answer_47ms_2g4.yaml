id: velux_skylight_blind_exchange_execute_answer_47ms_2g4
description: >
  The same exchange as the sibling capture with a 46 ms answer, but the bench tool starts its 0x3D 47 ms after the challenge's last bit. The blind ignores it: no 0x04 follows, and the capture ends with the unanswered 0x3D. Together the pair puts this blind's answer window between 46 and 47 ms; it is one blind under bench conditions, not a property of every device. The request, its train and the answer are the bench tool's commanded ones, the challenge is received. The 0x3D is re-keyed to the corpus key.
