id: somfy_awning_exchange_open_short_sx1262
description: >
  Sunea awning open (cover.open_cover, Home Assistant position 100 %), sent in the 6-byte main-parameter
  EXECUTE form (originator, ACEI, main parameter, two zero bytes; no FP1 speed block), the form the hub
  sends to covers without a chosen travel speed (ADR 0065). The awning is a horizontal awning configured
  with invert_position, so IO position 0 is retracted and the Home Assistant position equals the IO
  position. Own bench, Heltec WiFi LoRa 32 V3 (sx1262). The answer's byte 0 is 0x04: result code 0 in
  bits 7..3, execution state 4 in bits 2..0. An open in the 8-byte form with the speed block, main
  parameter 0x0000 (tests/corpus/captures/exchange/somfy_awning_exchange_open_sx1262.yaml), is answered
  with code 5 (byte 0 0x2C). The hub's follow-up status reads polled the awning while it moved; the
  last, 36.9 s after the command, reported execution done (status byte 0x05) at current position raw
  0xC800 (100.0 %, Home Assistant position 100 %), the position commanded. Frame bytes come from the
  hub's frame log; the 0x3C/0x3D payloads, which that log masks, and the timestamps (start of each burst
  on air) come from an SDR receiver recording the same exchange, CRC-checked; every unmasked byte agreed
  between the two.
