id: atlantic_agilia_exchange_status_read
description: >
  The climate entity's read-back of an Atlantic AGILIA IO radiator's heater (B6BDFC, type 52 subtype 1)
  right after boot: seven authenticated CMD_WRITE_PRIVATE (0x20) register reads `0C 60 01 <reg>`, each
  answered by CMD_WRITE_PRIVATE_ACK (0x21) echoing the four header bytes followed by the register's
  little-endian value. This is the first hardware capture of the reply to a read; until now only the
  write ack had been seen.

  Values, as the climate entity then showed them: room temperature
  0x0115 = 0x0779 hundredths = 19.13 C; setpoint 0x0103 = 0x00AF tenths = 17.5 C; mode 0x0100 = 2
  (program, shown as Auto with the Program preset); regulator 0x0117 = 0 (idle); window 0x010E = 0
  (closed); maximum setpoint 0x0102 = 0x0118 = 28.0 C; open-window detection 0x0106 = 1 (on).

  Every read is challenged: the radiator's 0x3C came 36-40 ms after our 0x20 and our 0x3D (preamble 8)
  drew the 0x21. Both challenge frames were masked in the reporter's log and are omitted, so this
  capture is not replayed as an exchange; the notes give each reply's timing.
