  device: "io-homecontrol tilt-capable cover (cover_position_tilt profile), node 51C001"
  captured_with: other
  firmware: "user build at commit 03b5f8d (log lines home_io_control:245/:269), predates commits 5aaf1e8 and 69c1ff3"
  date: 2026-08-11
  origin: github-issue
  issue: "https://github.com/laberning/home_io_control/issues/60"
key: unknown
