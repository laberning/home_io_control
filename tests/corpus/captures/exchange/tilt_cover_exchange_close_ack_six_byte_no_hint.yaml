id: tilt_cover_exchange_close_ack_six_byte_no_hint
description: >
  Real-hardware capture of a 6-data-byte CMD_PRIVATE_RESP (no byte-7 settle-delay hint) — the
  device's ack to a "close" EXECUTE command. On the reporter's build (predates commit 69c1ff3,
  "improves handling of status if no poll interval is set"), PRIVATE_RESPONSE_MIN_DATA_LEN was
  8, so this exact frame was rejected and logged as `unsupported_payload` (see the reporter's
  full log: "[W][home_io_control:215]: rx issue=unsupported_payload cmd=PRIVATE_RESP(0x04)
  src=51C001 (registered) dst=31BAF7 len=15 data_len=6"), silently discarding the ack and
  leaving Home Assistant stuck on the pre-command state. On current main
  PRIVATE_RESPONSE_MIN_DATA_LEN is 6 (lowered by 69c1ff3), so this same frame is accepted —
  this capture is the real-hardware counterpart to the synthetic regression test
  `hub_operations_test.cpp :: ShortPrivateResponseSixBytesIsAcceptedAndSchedulesSettlePoll`,
  proving a 6-byte no-hint reply genuinely occurs on hardware and isn't just a hypothetical edge
  case. No `expect.device` block: this is the immediate EXECUTE ack (trust_position=false in
  production) and its target/current bytes are the same kind of pre-command echo documented in
  tilt_cover_exchange_ack_echoes_precommand_tilt.yaml, not a verified real position.
