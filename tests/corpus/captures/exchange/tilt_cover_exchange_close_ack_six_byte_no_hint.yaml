  - dir: rx
    t_ms: 300
    freq: 868950000
    hex: "0E 00 31 BA F7 51 C0 01 3C 1F 27 66 71 49 81"
    crc: absent
    note: "cmd=CHALLENGE_REQ(0x3C), challenge = 1F 27 66 71 49 81"
  - dir: tx
    t_ms: 307
    freq: 868950000
    hex: "0E 00 51 C0 01 31 BA F7 3D 5A 41 66 6B E6 81"
    crc: absent
    note: "cmd=CHALLENGE_RESP(0x3D), HMAC under the reporter's real system key — not verifiable here (key: unknown)"
  - dir: rx
    t_ms: 340
    freq: 868950000
    hex: "8E 00 31 BA F7 51 C0 01 04 2C 80 A0 04 00 00"
    crc: absent
    note: "cmd=PRIVATE_RESP(0x04) EXECUTE ack, END — only 6 data bytes (2C 80 A0 04 00 00), byte 7 (settle hint) entirely absent; data[0]=0x2C (STATUS_STOPPED clear: moving), data[2..3]=0xA004 stale target, data[4..5]=0x0000 stale current"
expect:
  exchange:
    kind: authenticated_command
    outcome: success
  frames:
    - {cmd: 0x00, start: true, end: false, protocol: 2w}
    - {cmd: 0x3C, start: false, end: false, protocol: 2w, classification: REQUIRE_AUTH}
    - {cmd: 0x3D, start: false, end: false, protocol: 2w}
    - {cmd: 0x04, start: false, end: true, protocol: 2w, classification: ACCEPT}
