id: velux_ssl_exchange_stop_mid_motion_unanswered
description: >
  A two-way STOP sent to a VELUX SSL solar roller shutter while it was closing, issue #114
  (@michelpa), Heltec V3 / SX1262 hub E3F1D3, device entry `low_power: true` (1024-byte preamble,
  CTRL1 0x20). Three tries drew no frame at all — no CHALLENGE_REQ, nothing on any channel
  (stage=wait_first_timeout, saw_challenge=0). The shutter kept closing. The same shutter answers
  the byte-identical command shape from rest within one to three tries (see
  tests/corpus/captures/exchange/velux_ssl_exchange_set_position_ack_stale_target.yaml). The same silence
  is on record for a VELUX MSU solar screen (issue #95), whose OEM remote's one-way STOP
  (tests/corpus/captures/oneway/velux_kli313_oneway_stop.yaml) did stop it mid-travel.
  Two explanations fit this capture on its own: the motor may not transmit while it moves, or a
  moving (awake) motor may ignore the 1024-byte preamble, as this motor provably does while awake
  in its registration window
  (tests/corpus/captures/pairing/velux_ssl_pairing_directed_long_preamble_ignored.yaml), while the
  OEM burst's repeat copies carry short preambles. The preamble is the one that holds:
  tests/corpus/captures/exchange/velux_ssl_exchange_stop_mid_motion_short_preamble.yaml is this
  same device answering the byte-identical STOP behind a 32-byte preamble while moving, and its
  0x04 ack reports the motor itself as not stopped — so it does transmit during travel.
  t_ms are from the log line timestamps (first try 10:48:11.318).
