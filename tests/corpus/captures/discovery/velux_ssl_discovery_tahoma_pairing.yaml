id: velux_ssl_discovery_tahoma_pairing
description: >
  Community capture from issue #112 (@Koekoe): a Somfy TaHoma (node D63332) pairing a VELUX SSL
  PK06 solar roller shutter (node FB7B08) while a VELUX KLI 313 wall switch (node A47B9A) holds
  the system open. Passively overheard by the reporter's own Heltec WiFi LoRa 32 V3 (SX1262,
  software PHY) — the hub is neither party. It is the corpus's first end-to-end sighting of a
  foreign controller adding itself to an existing VELUX io system ("key copy"), and the first
  real DISCOVER_RESP (0x29) from a VELUX roller-shutter actuator.

  Sequence: the KLI 313 opens the system with a three-class DISCOVER_ALT_REQ (0x2E) sweep across
  00 00 BF / 00 00 FF / 00 03 7F (roller_shutter / awning / dual_shutter — same set as
  tests/corpus/captures/discovery/velux_kli310_discovery_alt_sweep.yaml and
  tests/corpus/captures/discovery/velux_kli313_discovery_alt_beacon.yaml, from two other KLI
  units). The TaHoma's opening 0x28 was on a channel the monitor was not parked on and is not in
  the log; the shutter's 0x29 answer to it is the first captured 2W frame. Then
  DISCOVER_CONFIRM (0x2C), a second DISCOVER_REQ (0x28) to the backbone group 00003B, and — after
  a KEY_TRANSFER (0x32) plus a bidirectional CHALLENGE_REQ (0x3C) round that are OMITTED here
  (0x32 and both 0x3C payloads are redacted by this project's own frame logger, exactly as the
  0x30 enrollment frames are in velux_kli310_discovery_alt_sweep.yaml) — the post-pairing reads
  GET_INFO1 (0x54) -> GET_INFO2_RESP (0x57), GET_NAME_RESP (0x51, name = "Shutter"), and an
  unsolicited PRIVATE_RESP (0x04) status frame. Pairing succeeded (the TaHoma has since driven
  the shutter); this file keeps the phase of its observable traffic, discovery.

  Why it is here:
  - The 0x29 payload is real VELUX actuator ground truth: manufacturer = 0x01 (MANUFACTURER_VELUX,
    not the Somfy 0x02 our own key-extraction responder emits), flags byte = 0x1D, timestamp =
    0xFF FF, backbone address = 00 00 00. Our responder hardcodes
    KEY_EXTRACTION_DISCOVER_RESP_FLAGS = 0xDD / _TIMESTAMP = 0x000E (proto_commands.cpp); 0x1D vs
    0xDD agree on the low bits including the odd "RF support = no" bit
    (DISCOVERY_FLAGS_RF_SUPPORT, proto_constants.h TODO(hardware-verify)) and differ only in the
    top two ATT-class bits (00 here vs 11). A third real 0x29 after
    tests/corpus/captures/pairing/velux_kux100_pairing_full.yaml and issue #80's KLR200.
  - Confirms a KLI 313 (a third A47B9A unit) sweeps exactly {roller_shutter, awning,
    dual_shutter} and nothing else to open a system.
  - First real VELUX 0x57 (near-empty: no ASCII model string, unlike the Somfy 0x57 in
    tests/corpus/captures/exchange/somfy_awning_exchange_get_name_sx1276.yaml), 0x51, and a solar
    roller-shutter 0x04 status frame.

  MACs / key material: none present. The 0x32 / 0x3C / 0x3D frames that would carry them are not
  in this capture, so key: unknown is honest (community capture, nothing to verify).
