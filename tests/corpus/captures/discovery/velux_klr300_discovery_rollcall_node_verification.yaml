id: velux_klr300_discovery_rollcall_node_verification
description: >
  Community capture: a real VELUX
  KLR300 two-way control pad (node E2D1FF) re-verifying the three nodes already enrolled on it,
  immediately after handing its system key to this project's key-extraction responder. Received
  by the tester's SX1276 board while the responder held CH2. The key exchange itself is in
  tests/corpus/captures/pairing/velux_klr300_pairing_key_extraction_success.yaml; this file is the
  traffic between that exchange's 0x32 and its final 0x36.

  Sequence: DISCOVER_SPE_REQ (0x2A) roll-call → 0x2B from 155D81 and 562292 (E50470's 0x2B not
  heard) → per node a directed DISCOVER_ALT_REQ (0x2E, payload 02) + authentication → per node
  DISCOVER_CONFIRM (0x2C) → four more 0x2A broadcasts ~1.8 s apart, each with a fresh 6-byte
  challenge → per node ADDRESS_REQ (0x36) + CHALLENGE_REQ (0x3C) → 0x37 from 155D81.
  OMITTED: every 0x3C / 0x3D (four heard: KLR300 0x3D to 562292 and E50470, 155D81's 0x3C, KLR300
  0x3C after the 0x36 to 562292 and E50470). Their payloads are masked by this project's own
  redaction before the log line is written, so they can't satisfy the declared-length check.
  Several device-side frames (562292's and E50470's 0x3C/0x2F/0x37, E50470's 0x2B) were never
  received at all; the KLR300 is heard cleanly, the devices only partially.

  Why it is here:
  - First real VELUX low-power 0x2B replies. Both decode through the standard 9-byte
    DISCOVERY_RESP layout: type 00 80 = roller_shutter subtype 0, backbone 00 00 00 (like the
    VELUX SSL 0x29 in tests/corpus/captures/discovery/velux_ssl_discovery_tahoma_pairing.yaml, and
    unlike Somfy, which repeats its own node id there), manufacturer 0x01 (VELUX), timestamp FF FF.
    Multi Information Byte 0x8D / 0xCD: ATT class 2 / 3, power-save bits 01 = POWER_SAVE_LOW_POWER.
  - The KLR300's roll-call is CTRL1 = 0x30 (ACK + LOW_POWER). At capture time, this project's
    scan_paired_devices roll-call sent CTRL1 = 0x00, so it got the normal start preamble, not
    LONG_PREAMBLE. The same tester's scan with the extracted key then found 0 devices. Evidence
    that a sleeping VELUX device needs the low-power roll-call form — not a proven cause.
  - Both 0x2B replies arrived on 868.95 MHz, the channel the 0x2A itself was received on. The
    receiver was held on CH2, so replies on other channels would be invisible; still, this is the
    first real-VELUX sighting against the "broadcast replies don't return on the request channel"
    premise of ListenPolicy::ROTATE_SKIPPING_REQUEST.
  - Directed frames to the (low-power) nodes all carry CTRL1 LOW_POWER; 0x36 adds PRIORITY (0x24);
    the device's 0x37 carries PRIORITY alone (0x04).

  key: unknown — community capture; the 0x2A HMACs are under the installation's real key, which
  nobody involved in this corpus holds, so there is nothing to verify or re-key.
