id: somfy_awning_discovery_spe_paired_rollcall
description: >
  Broadcast CMD_DISCOVER_SPE_REQ (0x2A), bench follow-up to B11
  (analysis/completed/spe_discovery_0x2a_next_steps.md §2.1): two already 2W-paired Somfy awnings (30E1F2, D268CE) each answer with a unicast
  CMD_DISCOVER_SPE_RESP (0x2B). Same broadcast TX as somfy_izymo_dimmer_discovery_spe_paired_rollcall.yaml
  — a third device (a dimmer, different device type) answered the identical request, split into
  its own fixture by device family per corpus convention. Together the two fixtures confirm the
  SPE roll-call finding across two distinct device types, not just one. A 0x2B payload uses the
  full 9-byte DISCOVERY_RESP layout, identical to a 0x29 — see the per-frame notes.
source:
  device: "Somfy horizontal awning (io actuator, 2W-paired), two independent units"
  captured_with: sx1276
  firmware: null
  date: 2026-08-09
  origin: own-hardware
  issue: null
key: corpus
frames:
  - dir: tx
    t_ms: 0
    freq: 868950000
    hex: "D4 00 00 00 3B C0 FF EE 2A 34 17 09 E5 E1 2A 3D EE 72 DB 44 6D"
    crc: absent
    note: "cmd=DISCOVER_SPE_REQ(0x2A), broadcast to backbone group 00003B, self-authenticating (6-byte random challenge + 6-byte HMAC over the command byte alone) — same TX also answered by a dimmer, see somfy_izymo_dimmer_discovery_spe_paired_rollcall.yaml"
  - dir: rx
    t_ms: 1300
    freq: 869850000
    hex: "D1 00 C0 FF EE 30 E1 F2 2B 04 00 30 E1 F2 02 CC FC 03"
    crc: absent
    note: "cmd=DISCOVER_SPE_RESP(0x2B) from already-paired awning 30E1F2, unicast to us (C0FFEE). Payload is the full 9-byte DISCOVERY_RESP layout, identical to a 0x29: type_msb/type_subtype=04/00 == encode_packed_device_type(HORIZONTAL_AWNING, subtype 0); backbone 30E1F2 at DISCOVERY_RESP_BACKBONE_OFFSET; manufacturer=0x02 (MANUFACTURER_SOMFY) at DISCOVERY_RESP_MANUFACTURER_OFFSET; Multi Information Byte 0xCC at DISCOVERY_RESP_FLAGS_OFFSET (ATT class 3, power-save always-alive); timestamp FC03 at DISCOVERY_RESP_TIMESTAMP_OFFSET — the timestamp is the field that advances between successive replies from this device"
  - dir: rx
    t_ms: 1443
    freq: 869850000
    hex: "D1 00 C0 FF EE D2 68 CE 2B 04 00 D2 68 CE 02 CC BB 2E"
    crc: absent
    note: "cmd=DISCOVER_SPE_RESP(0x2B) from a second, unrelated already-paired awning D268CE, unicast to us (C0FFEE). Same 9-byte DISCOVERY_RESP layout and same decoded fields as the 30E1F2 reply above (HORIZONTAL_AWNING/0, MANUFACTURER_SOMFY, flags 0xCC), with its own backbone address and its own independent timestamp (BB2E)"
expect:
  frames:
    - {cmd: 0x2A, start: true, end: true, protocol: 2w}
    - {cmd: 0x2B, start: true, end: true, protocol: 2w}
    - {cmd: 0x2B, start: true, end: true, protocol: 2w}
