id: velux_window_discovery_keyed_rollcall_flipper_cc1101
description: >
  Community capture: five VELUX mains-powered window actuators (type 4, subtype 1) answering keyed
  roll-call requests, received by the reporter's own CC1101 receiver and not by this project's
  hardware. The frames are a selection across several roll-call passes, not one uninterrupted
  exchange, and the roll-call requests themselves were not logged. Each 0x2B reply is addressed to
  the controller C0EE11 and carries the packed type/subtype 0101 (window opener, subtype 1),
  manufacturer 01 (VELUX) and flags 0C. No key material and no authentication response are
  present; the frames are unmodified, CRC bytes included.
