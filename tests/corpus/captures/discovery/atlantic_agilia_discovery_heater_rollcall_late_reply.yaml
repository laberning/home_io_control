id: atlantic_agilia_discovery_heater_rollcall_late_reply
description: >
  Scan Paired Devices under the hub key, 50 s after the pairing attempt in
  tests/corpus/captures/pairing/atlantic_agilia_pairing_key_pull_own_key_heater_silent.yaml. The
  previous sweep, 30 s earlier, drew no reply at all. This one is answered once, in the fourth of six
  attempts, by the AGILIA radiator's heater B6BDFC (type 52 subtype 1, Atlantic, always alive), 1020 ms
  after our 0x2A and on another channel (869.85 MHz) than the one we sent on (868.95 MHz). The log then
  printed the climate block that put the heater under control.

  Across all of issue #165's roll-calls three heaters answered 10 of 42 attempts, 274 to 1263 ms after
  the request, and two whole six-attempt sweeps were silent. The 2000 ms listen window covers every
  delay seen so far.
