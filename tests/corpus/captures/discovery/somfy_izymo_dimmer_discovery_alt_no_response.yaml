id: somfy_izymo_dimmer_discovery_alt_no_response
description: >
  Alternate discovery (CMD_DISCOVER_ALT_REQ, 0x2E) sent alone via pairing_discovery_commands:
  ["0x2E"] against the same Izymo dimmer paired with plain 0x28 in somfy_izymo_dimmer_pairing_full_sx1276.yaml, PROG
  pressed immediately before each attempt. All 3 tries across 2 separate discovery runs drew
  zero response and zero other RF activity on any channel (advice=rf_silent) — real evidence for
  proto_constants.h's uncited "response is 0x29" comment on CMD_DISCOVER_ALT_REQ: this device
  does not answer 0x2E at all, so its claimed response command is unconfirmed for this device
  rather than contradicted by it.
