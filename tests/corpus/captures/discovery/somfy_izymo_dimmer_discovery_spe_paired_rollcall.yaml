id: somfy_izymo_dimmer_discovery_spe_paired_rollcall
description: >
  Companion to somfy_awning_discovery_spe_paired_rollcall.yaml: the exact same broadcast
  CMD_DISCOVER_SPE_REQ (0x2A) TX, but showing the reply from a third, differently-typed
  already-paired device — the Somfy Izymo dimmer, re-paired via normal 0x28/0x29 discovery just
  before this run (node 415CE4) rather than left over from the original B11 session. Confirms the
  SPE roll-call finding (analysis/completed/spe_discovery_0x2a_next_steps.md §2.1) across a second device *type*
  (LIGHT, not just HORIZONTAL_AWNING): any device holding the controller's system key answers,
  regardless of what kind of actuator it is.
source:
  device: "Somfy Izymo dimmer (io light actuator, 2W-paired)"
  captured_with: sx1276
  firmware: null
  date: 2026-08-09
  origin: own-hardware
  issue: null
key: corpus
frames:
  - dir: tx
    t_ms: 0
    freq: 868950000
    hex: "D4 00 00 00 3B C0 FF EE 2A 34 17 09 E5 E1 2A 3D EE 72 DB 44 6D"
    crc: absent
    note: "cmd=DISCOVER_SPE_REQ(0x2A), broadcast to backbone group 00003B — same TX as somfy_awning_discovery_spe_paired_rollcall.yaml (three devices answered this one broadcast; this fixture and the awning one each carry a subset, split by device family per corpus convention)"
  - dir: rx
    t_ms: 271
    freq: 869850000
    hex: "D1 00 C0 FF EE 41 5C E4 2B 01 80 41 5C E4 02 CC 07 EB"
    crc: absent
    note: "cmd=DISCOVER_SPE_RESP(0x2B) from already-paired dimmer 415CE4, unicast to us (C0FFEE). Full 9-byte DISCOVERY_RESP layout, identical to a 0x29: type_msb/type_subtype=01/80 decodes to raw DeviceType 0x06 == DeviceType::LIGHT, subtype 0 — matches this device's real config (io_device_type: \"light\", io_subtype: 0); backbone 415CE4 at DISCOVERY_RESP_BACKBONE_OFFSET; manufacturer=0x02 (MANUFACTURER_SOMFY); Multi Information Byte 0xCC (ATT class 3, power-save always-alive) — byte-for-byte the same flags/manufacturer the two awnings report, only type and backbone and timestamp (07EB) differ"
expect:
  frames:
    - {cmd: 0x2A, start: true, end: true, protocol: 2w}
    - {cmd: 0x2B, start: true, end: true, protocol: 2w}
