id: exchange_force_open_sx1276
description: >
  force_open_device management action against the Patio Awning (an IoDevice::inverted device):
  EXECUTE(0x00) at elevated ACEI priority (level 0, protection_human: data[1]=0x03) targeting
  wire position 100 (data[2]=0xC8, doubled), the device's actual "fully open" value once
  inversion is resolved by execute_device_command_() (hub_operations.cpp). CONFIRMED WORKING
  (2026-07-16, visually observed): the awning genuinely opens this time, position climbing
  0% -> 2% -> 6% -> 13% -> 17%... toward target=100% across the follow-up polls (not part of
  this capture — see the sibling execute_ack_reports_stale_target_*.yaml pattern for why the
  immediate ack's target=0 bytes are the usual stale quick-ack placeholder, not the real target).
  This capture supersedes the two prior misfires
  (misfire_0x64_special_byte_reads_as_50pct_sx1276.yaml,
  misfire_elevated_priority_wrong_direction_sx1276.yaml) as the first confirmed-correct
  force-open exchange. Still NOT confirmed: whether elevated priority actually overrides an
  *active* wind/rain lock — this device was not under one during any of the three 2026-07-16
  test sessions (all got a clean ack, never RESULT_PRIORITY_LEVEL_LOCKED), so that part of
  analysis/reference_combined_integration.md item 5 remains open.
