id: execute_ack_reports_stale_target_open
description: >
  The device's immediate reply to an EXECUTE(open, target=22%) command reports a stale
  target=0%/position=0% instead of the just-commanded value. Verifies that this quick-ack frame
  decodes to the device's pre-command position, not the fresh target — the real value only
  arrives on the follow-up status poll.
