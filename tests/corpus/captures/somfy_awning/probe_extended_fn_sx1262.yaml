id: somfy_awning_probe_extended_fn_sx1262
description: >
  2026-08 battery/solar-telemetry follow-up. CMD_PRIVATE (0x03) probes against our own
  mains-powered awning at function IDs 0x06 and 0x09, sent in two shapes: the field-observed
  4-byte extended form 03 <fn> 80 <block> 00 (create_get_status_extended(), selector 0x80) at
  block 0x00/0x01/0x80, and the 3-byte form 03 09 01 00 (create_private_function() with a
  non-zero second payload byte). Results on this device:
    - fn=0x09, every shape and block value: byte-identical reply data=2D 00 58 22 00 00. The
      block byte and the 3-byte-form sub-index are ignored here; no 0x80 extended block is
      returned (contrast somfy_dimmer/probe_extended_fn_sx1262.yaml, where the dimmer's fn=0x09
      reply does carry an 0x80 block whose tail tracks the block byte).
    - fn=0x06, block 0x00: reply data=2D 00 00 00 00 00 -- identical to fn=0x09 except data[2..3]
      is zeroed. Consistent with the earlier private_fn_probe_lr1121.yaml finding that fn=0x06
      carries nothing on any device tested.
    - fn=0x06, block 0x80: CMD_ERROR_RESP (0xFE) result code 0x58. Not a code this codebase or
      the reference material names (command_result_name() returns UNKNOWN_RESULT_CODE); recorded
      as "block 0x80 rejected", not decoded. The dimmer answers 0x58 to the same frame.
  data[0]=0x2D is unexplained and constant across fn 0x06/0x09 here (it is 0x04/0x05, the
  stopped-flag byte, only on the fn=0x03 position-status form). data[2..3]=58 22 on fn=0x09 is a
  stored value in the position family (not a charge reading); 0x58 as a raw byte is ~44% of the
  fine 0..0xC800 position scale, plausibly this awning's "My" position, but not independently
  confirmed and not decoded. No charge/battery information in any reply -- the expected result
  for a mains device.
