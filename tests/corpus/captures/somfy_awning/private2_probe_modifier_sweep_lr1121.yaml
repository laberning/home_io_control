id: somfy_awning_private2_probe_modifier_sweep_lr1121
description: >
  CMD_PRIVATE2 (0x0C) long-form probes at modifiers 0x05, 0x06, and 0x09 against the awning,
  completing all five field-observed modifier values on this device (0x00 and 0x03 are in the
  sibling favorite/vent fixtures). All three replies are byte-identical to each other and to
  every other reading taken this day: data=6D D4 00 00 00. Modifier 0x06 matches the exact value
  the community-log reference fixture used on a different device to get a different, 7-byte
  reply -- this device answering with the same 5-byte shape rules out "0x06 is special" and
  points to a device/firmware difference instead. Combined with
  private2_probe_favorite_after_reprogram_lr1121.yaml, this settles the question on this
  hardware: none of the five modifiers vary, and the value does not track a real change to the
  stored My position.
