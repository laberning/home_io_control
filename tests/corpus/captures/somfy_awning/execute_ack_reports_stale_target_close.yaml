id: execute_ack_reports_stale_target_close
description: >
  The device's immediate reply to an EXECUTE(close, target=0%) command reports a stale
  target=22% — its position from before this command — instead of 0%. Verifies the same
  quick-ack quirk with different byte values, confirming this is a real device behavior and not
  an offset-decoding mistake.
