id: execute_ack_reports_stale_target_close
description: >
  The device's immediate reply to an EXECUTE(close, target=0%) command carries a stale target of
  25% — its pre-command position — instead of the just-commanded 0%. The target bytes
  (data[2..3] = 32 00 -> 0x3200 of 0xC800 = 25%) are the stale field; the current bytes
  (data[4..5] = 00 00) decode to 0%, so `reported_position` is 0 here. The true value only
  arrives on the follow-up status polls, which reported 22%, 19%, 15% ... in the same session.
  Recorded back-to-back with execute_ack_reports_stale_target_open.yaml, and the pair is the
  point: there the device is commanded to 25% and its ack's target reads 0%. Each ack echoes the
  *other* scenario's pre-command value, which rules out a fixed-offset decode error on our side
  and pins the behaviour as the device reporting pre-command state.
