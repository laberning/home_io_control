id: velux_ssl_pairing_directed_long_preamble_ignored
description: >
  A never-hub-paired VELUX SSL solar roller shutter (node B2D242) answering this project's own
  discovery request, then ignoring every frame the hub sends to it directly. Issue #114 (@michelpa),
  Heltec V3 / SX1262 hub E3F1D3, one Discover & Pair attempt out of four identical ones in the same
  session. Discovery goes out with `pairing_discovery_preamble: 32`,
  `pairing_discovery_destination: 0x00003F` and `pairing_discovery_ack_capable: true` (CTRL1 0x10)
  and is answered within ~90 ms, off the request channel. The three DISCOVER_CONFIRM (0x2C) and three
  KEY_INIT (0x31) frames that follow were transmitted with a 1024-byte preamble (the hub's rule for a
  target that reports low-power) and drew no frame at all on any channel — not an error, silence.
  The decisive variable is not visible in the bytes: this schema records no preamble length. The
  byte-identical 0x2C/0x31 sent with a 32-byte preamble were answered and the pairing completed
  (same issue, later the same day: node 7CDAD3, full sequence, no log excerpt posted), which is the
  VELUX instance of the long-preamble failure ADR 0029 records for always-alive VELUX products.
  The 0x29's last two bytes are a seconds counter: 0x01A1 = 417 here, and 443 / 459 / 471 in the
  session's next three answers, exactly 1 Hz, i.e. seconds since the motor last started — not a
  pairing-window timer. t_ms are from the log line timestamps.
