id: somfy_izymo_dimmer_pairing_full_discover_confirm_sx1262
description: >
  Complete, unmasked end-to-end pairing of a Somfy Izymo dimmer by this project's own PairingEngine
  with the discover-confirm step (ADR 0039) at its default (`send`), on a Heltec V3 / SX1262 hub
  C0FFEE with default tuning. The step-on counterpart of somfy_izymo_dimmer_pairing_full_sx1262,
  which predates the step: here the engine sends DISCOVER_CONFIRM (0x2C, `48 00`) between the
  device's 0x29 and its own 0x31, and the device acknowledges it (0x2D) on the request channel,
  13 ms later per the engine. The rest of the sequence is unchanged: 0x31 → 0x3C → 0x32 → 0x33, then
  the phase-3 SET_CONFIG1 (0x6F), which the device challenges, accepts the 0x3D for, and still
  answers with ERROR_RESP 0x28, as in every earlier Izymo pairing. Captured with a temporary
  -DIOHOME_UNSAFE_LOG_KEY_MATERIAL build and re-keyed at ingest (ingest.py --rekey verified the
  captured 0x32 and 0x3D against the real key first). The directed start frames went out with the
  default preambles (0x28/0x31/0x6F 1024 bytes, 0x2C 32 bytes to this always-alive target) — not
  recorded by the schema. t_ms are log line timestamps, which lag the radio slightly.
