id: atlantic_agilia_pairing_key_pull_heater_direct_read
description: >
  A Discover & Pair of an Atlantic AGILIA IO radiator that finds its heater with one register read
  instead of a roll-call. The radiator is in its display's pairing mode ("Connectivité" ->
  "Connexion") and answers the third discovery request from B6BDFB as node type FF C0 (1023, remote
  controller), so the hub pulls the key: our 0x38 draws a 0x32 holding the radiator's own key, and the
  radiator's 0x3D to our 0x3C proves it (key check value A91125, the same as two earlier pulls of this
  radiator). The hub then reads the maximum-setpoint register of B6BDFC, the pairing address + 1, under
  that key. The heater challenges the read and answers 28.0 C, so the hub registers B6BDFC and prints
  its climate block without a roll-call. The whole attempt took 6.2 s.

  The 0x32 (16-byte encrypted key), our 0x3C and the radiator's 0x3D during the pull, and the heater's
  0x3C and our 0x3D during the read, were masked in the reporter's log and are omitted; the notes say
  where they sat. Timestamps are the hub's own pairing-attempt summary offsets, rebased to the first
  0x28; the 0x21 is placed 73 ms after the 0x20, as the log lines show.
source:
  device: "Atlantic AGILIA IO electric radiator (display model), radiator 1: pairing node B6BDFB, heater B6BDFC"
  captured_with: sx1262
  firmware: "Heltec WiFi LoRa32 V3, main with the direct heater read after a key pull"
  date: 2026-10-21
  origin: github-issue
  issue: "https://github.com/laberning/home_io_control/issues/165"
key: unknown
