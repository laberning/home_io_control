  - dir: tx
    t_ms: 5189
    freq: 868950000
    hex: "48 00 B6 BD FB 60 F8 23 2C"
    crc: absent
    note: "cmd=DISCOVER_CONFIRM(0x2C), preamble 48"
  - dir: rx
    t_ms: 5203
    freq: 868950000
    hex: "88 00 60 F8 23 B6 BD FB 2D"
    crc: absent
    note: "cmd=DISCOVER_CONFIRM_ACK(0x2D), 14 ms after the 0x2C. rssi -44"
  - dir: tx
    t_ms: 5535
    freq: 868950000
    hex: "4E 04 B6 BD FB 60 F8 23 38 E4 C2 14 7B AA 64"
    crc: absent
    note: "cmd=LAUNCH_KEY_TRANSFER(0x38), START, CTRL1 bit 2 set, six random bytes, preamble 48. The radiator answered at t=5554 with KEY_TRANSFER(0x32, 18 04, 16 bytes masked); we challenged it at t=5570 (0x3C, preamble 8, masked) and its 0x3D (8E 00, masked) verified under the decrypted key: key check value A91125."
  - dir: tx
    t_ms: 5614
    freq: 868950000
    hex: "4C 00 B6 BD FC 60 F8 23 20 0C 60 01 02"
    crc: absent
    note: "cmd=WRITE_PRIVATE(0x20) to B6BDFC (pairing node + 1), read register 0x0102 (maximum setpoint), under the pulled key, preamble 48. The heater challenged it (0x3C 0E 00, masked) and we answered with a 0x3D (0E 20, preamble 8, masked)."
  - dir: rx
    t_ms: 5687
    freq: 868950000
    hex: "8E 00 60 F8 23 B6 BD FC 21 0C 60 01 02 18 01"
    crc: absent
    note: "cmd=WRITE_PRIVATE_ACK(0x21): register 0x0102 = 0x0118 = 28.0 C. The hub registers B6BDFC as an electrical heater with an adjustable setpoint and runs no roll-call."
