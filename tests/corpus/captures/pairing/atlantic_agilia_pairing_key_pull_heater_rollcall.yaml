id: atlantic_agilia_pairing_key_pull_heater_rollcall
description: >
  A complete Discover & Pair of an Atlantic AGILIA IO radiator with pairing_key_transfer: auto. The
  radiator is in its display's pairing mode ("Connectivité" -> "Connexion") and answers discovery from
  986110 with node type FF C0 (1023, remote controller), so the hub pulls the key: our 0x38 draws a
  0x32 holding the radiator's own key 18 ms later, and the radiator's 0x3D to our 0x3C proves it holds
  that key (key check value A73DD4, different from the hub's key). A roll-call under the pulled key is
  then answered by 986111, the pairing address + 1, as type 52 subtype 1 (electrical heater with an
  adjustable setpoint, Atlantic, always alive). The hub registers 986111 and prints a climate block
  with that key; the same heater then took and read back setpoint and mode writes (the climate test in
  issue #165).

  The heater answers three of the six roll-call attempts, 931, 319 and 274 ms after our 0x2A, each time
  on a different channel than the one we sent on. Only the first reply carries a cmd expectation: the
  roll-call replay suite expects one reply per device per capture, and the other two are kept for the
  timing.

  The 0x32 (16-byte encrypted key), our 0x3C and the radiator's 0x3D were masked in the reporter's log
  and are omitted; the notes say where they sat. Timestamps are the hub's own pairing-attempt summary
  offsets, because the log batched several lines under one timestamp. The 0x2A frames carry a MAC under
  the radiator's key, which is not recoverable from them; the key itself is in no frame here.
