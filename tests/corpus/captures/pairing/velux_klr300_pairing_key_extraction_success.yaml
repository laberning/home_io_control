id: velux_klr300_pairing_key_extraction_success
description: >
  Community capture: this project's
  key-extraction responder, on a tester's SX1276 board, recovering the system key from a real
  VELUX KLR300 two-way control pad (node E2D1FF) while the KLR300 runs its own "search for new
  products". First KLR300 in the corpus; same flow as
  tests/corpus/captures/pairing/velux_klr200_pairing_key_extraction_success.yaml, first try, and
  the responder logged SYSTEM KEY EXTRACTED and answered the follow-up address round.

  Only frames the board *received* are here. The tester's log carried io_capture lines for
  inbound frames only, so the responder's own transmissions — DISCOVER_RESP (0x29, throwaway id
  7F6B0F), DISCOVER_CONFIRM_ACK (0x2D), CHALLENGE_REQ (0x3C), KEY_CONFIRM (0x33), ADDRESS_RESP
  (0x37) — are known only from the responder's INFO log lines, not as wire bytes, and are not
  reconstructed. KEY_TRANSFER (0x32, ctrl0/ctrl1 18 00, rx ~53 ms after 0x31) is omitted because
  this project's own redaction masks its payload before the log line is written (same treatment
  as the KLR200 capture). With no tx frame there is no origin for the pairing replay/classification
  tests, so this capture deliberately carries no expect.exchange block.

  Why it is here — the KLR300's per-phase CTRL1 choice, visible byte-for-byte:
  - DISCOVER_ALT_REQ (0x2E) broadcast to 00003F, payload 00: CTRL1 = 0x20 (LOW_POWER only).
  - DISCOVER_REQ (0x28) broadcast to 00003B: CTRL1 = 0x10 (ACK only), matching the KLR200 and KIG300
    0x28 frames already in the corpus.
  - Every directed frame to the throwaway (0x2C, 0x31, 0x36): CTRL1 LOW_POWER set (0x36 also
    PRIORITY, 0x24). The responder's 0x29 advertises flags 0xDD (power-save = low_power), so the
    hub appears to mirror the target's advertised power class.
  Our own discovery tunables (pairing_discovery_low_power / pairing_discovery_ack_capable) apply one
  CTRL1 choice to every discovery command, so they cannot reproduce this 0x2E/0x28 split.
  The KLR300's roll-call and existing-node verification that ran between 0x31 and the final 0x36
  are in tests/corpus/captures/discovery/velux_klr300_discovery_rollcall_node_verification.yaml.
  As with the KLR200, no CHALLENGE_REQ (0x3C) address challenge followed the responder's 0x37 —
  whereas the KLR300 did issue one after each real device's 0x37 in that sibling capture.
