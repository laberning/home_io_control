id: somfy_izymo_dimmer_pairing_full_discover_confirm_sx1276
description: >
  SX1276 sibling of somfy_izymo_dimmer_pairing_full_discover_confirm_sx1262: the same Somfy Izymo
  dimmer paired end to end by this project's own PairingEngine with the discover-confirm step
  (ADR 0039) at its default (`send`), default tuning, on a Heltec V2 / SX1276 hub C0FFEE. Covers the
  fast-turnaround key-exchange path: the 0x32 goes out through ExchangeEngine::send_and_receive(),
  which catches the 0x33 directly, where the SX1262 capture uses the dedicated confirm wait. The
  sequence is otherwise the same: 0x2C `48 00` answered by 0x2D on the request channel (14 ms per
  the engine), 0x31 → 0x3C → 0x32 → 0x33, then SET_CONFIG1 (0x6F) → 0x3C → 0x3D → ERROR_RESP 0x28.
  Captured with a temporary -DIOHOME_UNSAFE_LOG_KEY_MATERIAL build and re-keyed at ingest
  (ingest.py --rekey verified the captured 0x32 and 0x3D against the real key first). Default
  preambles (0x28/0x31/0x6F 1024 bytes, 0x2C 32 bytes, continuation frames 12 bytes on this chip) —
  not recorded by the schema. t_ms are log line timestamps, which lag the radio.
