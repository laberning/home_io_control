id: atlantic_agilia_pairing_key_pull_heater_not_next_address
description: >
  A Discover & Pair of an Atlantic AGILIA IO radiator right after the reporter deleted all its
  connections from the radiator's Expert menu. Before the reset this radiator paired as B6BDFB with
  its heater at B6BDFC; afterwards it answers discovery as D6BC6C (node type FF C0, 1023, remote
  controller) and hands over a new key (key check value 3D05C0, proven by its 0x3D). The hub reads the
  maximum-setpoint register of D6BC6D, the pairing address + 1, and gets no answer in three tries, so
  it runs a roll-call under the pulled key. The heater answers it from F519DD, an address unrelated to
  the pairing node, as type 52 subtype 1 (electrical heater with an adjustable setpoint, Atlantic,
  always alive), in two of the six attempts. The hub registers F519DD and prints its climate block; the
  reporter flashed it and controls the radiator through F519DD. The whole attempt took 21.1 s.

  Only the first 0x2B carries expectations: the roll-call replay suite expects one reply per device per
  capture, and the later frames are kept for the timing. The 0x32 (16-byte encrypted key), our 0x3C and
  the radiator's 0x3D were masked in the reporter's log and are omitted; the notes say where they sat.
  Timestamps are the hub's own pairing-attempt summary offsets, rebased to the first 0x28; each 0x2B is
  placed at the offset after its 0x2A that the hub logged. The 0x2A frames carry a MAC under the
  radiator's key, which is not recoverable from them; the key itself is in no frame here.
