id: somfy_connectivity_kit_pairing_key_extraction_stall
description: >
  Community capture from issue #45 (@alucryd): the "Accept Foreign Pairing (Key Extraction)"
  responder being paired to by a real Somfy connectivity kit hub (node CA0A18). This hub sends
  CMD_DISCOVER_CONFIRM (0x2C) to the throwaway device and never proceeds to CMD_KEY_INIT (0x31), in
  this or any other attempt across two full log sessions (~13 combined minutes of arm time, 3
  throwaway IDs). Do NOT read that as this hub being stricter than the reporter's Velux (see
  velux_kig300_pairing_key_extraction_stall.yaml): it sent only ONE 0x2C in total and answered our
  discovery only 3 times, against the Velux's 28 and 21, so the sample is far too thin to rank the
  two -- and the Velux stalled the same way on 27 of its 28 attempts. What the two captures jointly
  support is only that both hubs send this step and neither reliably continues without the answer.
  To make the missing step undeniable, this capture also includes -- from the exact same
  short window, same hub -- a real already-paired device correctly answering the identical 0x2C
  with 0x2D within 4.4 seconds. See analysis/issue_45_key_extraction_stall_analysis.md (Finding 1)
  for the full write-up. Original on-air log has since been deleted; this capture is the durable
  record of what it showed. tx-frame timestamps (what the device sent) are wall-clock-second
  derived approximations; rx-frame timestamps (what the hub sent) use the precise on-device ts=
  tick counter.
source:
  device: "Somfy connectivity kit hub (node CA0A18) -- real third-party hub, community capture"
  captured_with: sx1276
  firmware: null
  date: 2026-08-12
  origin: github-issue
  issue: https://github.com/laberning/home_io_control/issues/45
key: unknown
frames:
  - dir: tx
    t_ms: 0
    freq: 868250000
    hex: "C8 00 00 00 3B CA 0A 18 28"
    crc: absent
    note: "cmd=DISCOVER_REQ(0x28), broadcast to backbone group 00003B"
  - dir: rx
    t_ms: 300
    freq: 868250000
    hex: "D1 00 CA 0A 18 CA FC 4A 29 00 80 CA FC 4A 02 00 00 00"
    crc: absent
    note: "cmd=DISCOVER_RESP(0x29), throwaway device id CAFC4A, manufacturer=2 (Somfy), type=roller_shutter; sent identically on all 3 channels, one shown"
  - dir: tx
    t_ms: 1727
    freq: 869850000
    hex: "48 10 CA FC 4A CA 0A 18 2C"
    crc: absent
    note: "cmd=DISCOVER_CONFIRM(0x2C), addressed directly to the discovered device. The responder has no 0x2C handler (pairing_responder.cpp), so nothing is sent back. Unlike the reporter's Velux hub, this hub never retries or proceeds past this point: no CMD_KEY_INIT (0x31) addressed to any of this reporter's 3 throwaway IDs (CAFC4A here, plus 62A34C and 480D9F in a later session) appears anywhere in either of the two source log files"
  - dir: tx
    t_ms: 14046
    freq: 869850000
    hex: "48 20 E2 AE 39 CA 0A 18 2C"
    crc: absent
    note: "cmd=DISCOVER_CONFIRM(0x2C) to a real, already-paired device (E2AE39) on this same hub, ~12s after the frame above -- included for direct contrast. ctrl1=0x20 (CTRL1_LOW_POWER) here vs 0x10 (CTRL1_ACK) for our own throwaway device above; the hub appears to mirror back a per-device flag rather than using one fixed value, plausibly derived from what each device's own CMD_DISCOVER_RESP (0x29) advertised in its flags byte (see analysis/issue_45_key_extraction_stall_analysis.md Finding 5 -- our own 0x29 leaves that byte at 0x00)"
  - dir: rx
    t_ms: 18421
    freq: 868950000
    hex: "88 00 CA 0A 18 E2 AE 39 2D"
    crc: absent
    note: "cmd=DISCOVER_CONFIRM_ACK(0x2D) from E2AE39, 4.4s after the hub's 0x2C above -- proof, from this exact hub in this exact session, of the reply it is waiting for and never received from the throwaway device"
expect:
  exchange:
    kind: pairing
    outcome: timeout
  frames:
    - {cmd: 0x28, start: true, end: true, protocol: 2w}
    - {cmd: 0x29, start: true, end: true, protocol: 2w, classification: DISCOVERY_ACCEPT}
    - {cmd: 0x2C, start: true, end: false, protocol: 2w}
    - {cmd: 0x2C, start: true, end: false, protocol: 2w}
    - {cmd: 0x2D, start: false, end: true, protocol: 2w}
