id: atlantic_agilia_pairing_key_pull_own_key_heater_silent
description: >
  Discover & Pair of an Atlantic AGILIA IO radiator that already holds the hub's key (radiator 1, paired
  the day before under the key it handed over). It answers discovery from B6BDFB as a remote controller
  (node type 1023) and our 0x38 with a 0x32 that decrypts to the hub's own key (key check value A91125).
  The roll-call under that key then draws no reply in any of its six attempts, although the radiator's
  heater B6BDFC (pairing node + 1) answered a roll-call under the same key the day before and again
  50 s after this attempt (tests/corpus/captures/discovery/atlantic_agilia_discovery_heater_rollcall_late_reply.yaml).

  With no heater found, the hub falls through to the push path's ending: it sends the optional
  SET_CONFIG1 (0x6F) to the pairing node, which answers FE 08 (code 1, COMMAND_UNKNOWN, the same
  refusal it gives a pushed key), and then registers B6BDFB itself as a paired remote controller with
  no platform. The attempt reports outcome=paired, which is wrong for this device: the node it
  registered is not the one that can be controlled.

  The 0x32 (16 encrypted bytes) was masked in the reporter's log and is omitted. Timestamps are the
  hub's pairing-attempt summary offsets.
