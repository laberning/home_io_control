id: somfy_izymo_dimmer_exchange_on
description: >
  Turn-on command (light.turn_on) issued to the Izymo dimmer, the first authenticated EXECUTE
  exchange captured from a light-class device. platform_light.cpp treats position < 50 as on:
  the TX payload here is byte-for-byte the same EXECUTE(target=0) frame the cover platform sends
  for "open" (see somfy_awning/exchange_open_sx1276.yaml) — this light-class device is driven
  through the exact same position-based command as a cover, just with binary on/off traits and
  a <50 threshold layered on top by the platform, not a distinct dimmer/brightness command.
source:
  device: "Somfy Izymo dimmer (io light actuator)"
  captured_with: sx1276
  firmware: null
  date: 2026-08-02
  origin: own-hardware
  issue: null
key: corpus
frames:
  - dir: tx
    t_ms: 0
    freq: 868950000
    hex: "50 20 38 96 18 C0 FF EE 00 01 43 00 00 80 D8 06 00"
    crc: absent
    note: "cmd=EXECUTE(0x00), position=0 (raw 0x00) — treated as ON by platform_light.cpp's <50 threshold"
  - dir: rx
    t_ms: 252
    freq: 868950000
    hex: "0E 00 C0 FF EE 38 96 18 3C 9B 9D B9 1B FA FB"
    crc: absent
    note: "cmd=CHALLENGE_REQ(0x3C)"
  - dir: tx
    t_ms: 257
    freq: 868950000
    hex: "0E 20 38 96 18 C0 FF EE 3D C7 1E 8F E8 6F 25"
    crc: absent
    note: "cmd=CHALLENGE_RESP(0x3D)"
  - dir: rx
    t_ms: 290
    freq: 868950000
    hex: "90 00 C0 FF EE 38 96 18 04 2C 00 C8 00 80 D8 06 00"
    crc: absent
    note: "cmd=PRIVATE_RESP(0x04); quick EXECUTE-ack, data_len=8 (2 bytes longer than the awning's 6-byte ack). trust_position=false for this response type (hub_operations.cpp passes trust_position=(cmd != CMD_EXECUTE)), and it shows here: target/current decode to 100%/64% respectively — neither matches the just-commanded ON, and 64% isn't a clean stale value either. Bytes 4-7 (80 D8 06 00) are an exact echo of the outbound EXECUTE frame's own trailing bytes, so the 'current' field here is coincidentally decoding echoed command bytes, not real device telemetry — not asserted in expect: below for that reason. The real settled value arrives on the follow-up status poll (see status_poll_light_on_sx1276.yaml)."
expect:
  exchange:
    kind: authenticated_command
    outcome: success
  frames:
    - {cmd: 0x00, start: true, end: false, protocol: 2w}
    - {cmd: 0x3C, start: false, end: false, protocol: 2w, classification: REQUIRE_AUTH}
    - {cmd: 0x3D, start: false, end: false, protocol: 2w, hmac_valid: true}
    - {cmd: 0x04, start: false, end: true, protocol: 2w, classification: ACCEPT}
