id: somfy_dimmer_get_info2_probe_sx1262
description: >
  CMD_GET_INFO2 (0x56) probe against our own mains-powered dimmer (node 4200E0), from the 2026-08
  battery/solar-telemetry follow-up. First capture of this request built by our own stack
  (create_get_info2(), probe get_info2) drawing a live GET_INFO2_RESP (0x57) -- prior corpus 0x57
  frames (issues/issue_45_capability_probe_burst.yaml) were replies to a Velux hub's request.
  Reply payload: 10 ASCII bytes "5143802A06" (a Somfy-internal reference/sw-version code, not a
  public catalogue number), then the packed type/subtype bytes this component already decodes at
  data[10..11]. Human-verified: data[10]=0x01, data[11]=0x80 -> (0x01<<2)|(0x80>>6) = 0x06 = LIGHT
  via decode_packed_device_type() (proto_device_model.cpp), matching this device's known identity
  ("Dimmable Light"). No auth challenge preceded the reply on this device.
