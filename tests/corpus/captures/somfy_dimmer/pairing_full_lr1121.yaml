id: somfy_izymo_dimmer_pairing_full_lr1121
description: >
  Real end-to-end pairing exchange (discovery through PairingEngine key transfer + phase-3
  config) with a Somfy Izymo dimmer, captured on the LilyGO T3-S3/LR1121 hub — the third radio
  chip alongside `pairing_full.yaml` (sx1276) and `pairing_full_sx1262.yaml`, all against the
  same physical device (node CF5F20 here, re-paired after a factory reset between captures).
  Challenge RSSI is -41 dBm, consistent with SX1262's -38 dBm for the same device — LR1121 RSSI
  reflects the received frame's actual signal level, comparable across chips.
