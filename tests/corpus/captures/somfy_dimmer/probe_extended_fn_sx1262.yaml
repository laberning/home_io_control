id: somfy_dimmer_probe_extended_fn_sx1262
description: >
  2026-08 battery/solar-telemetry follow-up, companion to
  somfy_awning/probe_extended_fn_sx1262.yaml. Same probe set against our own mains-powered
  dimmer (node 4200E0). Unlike the awning, this device's fn=0x09 extended reply DOES carry an
  0x80 block, and its tail tracks the block byte:
    - fn=0x09, block 0x00: data=05 00 D8 0A 80 00 00 00
    - fn=0x09, block 0x01: data=05 00 D8 0A 80 D8 06 00   (tail 00 00 00 -> D8 06 00)
  This is the first time one of our own probes (rather than a Velux hub's) has drawn a non-empty,
  block-selected 0x80 block. Its content is still position family: data[2..3]=D8 0A is constant
  regardless of block (0xD8 coincides with POS_FAVORITE in proto_constants.h -- noted, not
  claimed as a decode; the same D8 0A appeared on the older somfy_dimmer/private_fn_probe_lr1121.yaml
  reply from a different dimmer node, 1DAF16, so it reproduces across dimmers/sessions), and the
  block 0x01 tail D8 06 is another value in that same family. No charge/battery reading anywhere.
    - fn=0x06, block 0x00: data=05 00 00 00 00 00 -- data[2..3] zeroed, fn=0x06 carries nothing.
    - fn=0x06, block 0x80: CMD_ERROR_RESP (0xFE) result code 0x58, same as the awning.
    - 3-byte form 03 09 01 00: reply data=2D 00 D8 0A 00 00 -- the shorter "0x2D-framed" shape
      (data[0]=0x2D, no 0x80 block), same as the awning's replies, again carrying D8 0A.
  The 0x80 selector changes the reply framing on this device: data[0]=0x05 (stopped-flag byte)
  with an 0x80 block in the extended form, vs data[0]=0x2D and no block in the 3-byte form.
