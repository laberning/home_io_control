    crc: absent
    note: "cmd=PRIVATE(0x03), same no-challenge shape as the other somfy_dimmer status-poll captures"
  - dir: rx
    t_ms: 62
    freq: 868950000
    hex: "96 00 C0 FF EE CF 5F 20 04 05 00 32 00 32 00 00 00 C0 FF EE 01 00 00"
    crc: absent
