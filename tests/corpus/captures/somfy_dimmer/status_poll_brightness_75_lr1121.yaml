id: somfy_izymo_dimmer_status_poll_brightness_75_lr1121
description: >
  Status poll (PRIVATE 0x03, no challenge round-trip) of the Izymo dimmer over the LilyGO
  T3-S3/LR1121 hub after settling at 75% brightness (commanded in
  exchange_set_brightness_75_lr1121.yaml) — the LR1121 sibling of
  status_poll_brightness_75_sx1276.yaml/status_poll_brightness_75_sx1262.yaml. This device's
  io_position = 100 - brightness, so the wire-level position/target fields decode to
  io_position 25.
