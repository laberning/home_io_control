id: somfy_izymo_dimmer_exchange_on_lr1121
description: >
  Turn-on command (light.turn_on) issued to the Izymo dimmer over the LilyGO T3-S3/LR1121 hub —
  the LR1121 sibling of exchange_on_sx1276.yaml/exchange_on_sx1262.yaml, same EXECUTE shape,
  position=0 (raw). See that capture's note for why the light platform reuses the plain
  cover-position EXECUTE command rather than a distinct dimmer/brightness command. The HA
  "Dimmable Light RSSI" sensor read -40 dBm in this session, consistent with SX1262.
source:
  device: "Somfy Izymo dimmer (io light actuator)"
  captured_with: lr1121
  firmware: null
  date: 2026-08-03
  origin: own-hardware
  issue: null
key: corpus
frames:
  - dir: tx
    t_ms: 0
    freq: 868950000
    hex: "50 20 CF 5F 20 C0 FF EE 00 01 43 00 00 80 D8 06 00"
    crc: absent
    note: "cmd=EXECUTE(0x00)"
  - dir: rx
    t_ms: 67
    freq: 868950000
    hex: "0E 00 C0 FF EE CF 5F 20 3C EA 23 8F CC 10 EF"
    crc: absent
    note: "cmd=CHALLENGE_REQ(0x3C)"
  - dir: tx
    t_ms: 68
    freq: 868950000
    hex: "0E 20 CF 5F 20 C0 FF EE 3D 8D A6 59 F8 73 B3"
    crc: absent
    note: "cmd=CHALLENGE_RESP(0x3D); rekeyed under the public corpus key"
  - dir: rx
    t_ms: 95
    freq: 868950000
    hex: "90 00 C0 FF EE CF 5F 20 04 2C 00 C8 00 80 D8 06 00"
    crc: absent
    note: "cmd=PRIVATE_RESP(0x04); quick EXECUTE-ack, same stale/untrustworthy shape as exchange_on_sx1276.yaml's ack — target/current decode to 100%/64%, not the just-commanded ON, and bytes 4-7 (80 D8 06 00) are an exact echo of the outbound EXECUTE frame's own trailing bytes, not real telemetry. Not asserted in expect: below for that reason; the real settled value arrives on the follow-up status poll (see status_poll_light_on_lr1121.yaml)."
expect:
  exchange:
    kind: authenticated_command
    outcome: success
  frames:
    - {cmd: 0x00, start: true, end: false, protocol: 2w}
    - {cmd: 0x3C, start: false, end: false, protocol: 2w, classification: REQUIRE_AUTH}
    - {cmd: 0x3D, start: false, end: false, protocol: 2w, hmac_valid: true}
    - {cmd: 0x04, start: false, end: true, protocol: 2w, classification: ACCEPT}
