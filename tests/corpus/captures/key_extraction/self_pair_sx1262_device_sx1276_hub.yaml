id: key_extraction_self_pair_sx1262_device_sx1276_hub
description: >
  Real, fully re-keyed end-to-end capture of the Accept Foreign Pairing key-extraction responder (pairing_responder.h / hub_key_extraction.cpp) being paired to by this project's own PairingEngine acting as an ordinary controller -- the mirror direction of self_pair_sx1276_device_sx1262_hub.yaml, with roles swapped (SX1262 as the responder/device role this time, the direction the feature plan flagged as highest turnaround risk). Captured from the controller's (SX1276) own log with -DIOHOME_UNSAFE_LOG_KEY_MATERIAL temporarily enabled to obtain the raw 0x32 bytes, then rekeyed with --rekey. Confirms the full 0x28-0x33 exchange round-trips on real RF hardware and that the responder recovers the controller's real system key byte-for-byte, even with one retry needed at both the key-init and key-transfer steps (expected SX1262-settle-time behavior, tolerated by the responder's retry-safe state machine).
