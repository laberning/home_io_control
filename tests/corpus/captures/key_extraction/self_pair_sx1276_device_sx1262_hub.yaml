id: key_extraction_self_pair_sx1276_device_sx1262_hub
description: >
  Real, fully re-keyed end-to-end capture of the Accept Foreign Pairing key-extraction responder (pairing_responder.h / hub_key_extraction.cpp) being paired to by this project's own PairingEngine acting as an ordinary controller. Captured from the controller's (SX1262) own log with -DIOHOME_UNSAFE_LOG_KEY_MATERIAL temporarily enabled to obtain the raw 0x32 bytes, then rekeyed with --rekey. Confirms the full 0x28-0x33 exchange round-trips on real RF hardware and that the responder recovers the controller's real system key byte-for-byte.
source:
  device: "This project's own hub firmware, self-paired (SX1276 device role, key-extraction responder <-> SX1262 controller role, normal Discover & Pair)"
  captured_with: sx1262
  firmware: null
  date: 2026-08-02
  origin: own-hardware
  issue: null
key: corpus
