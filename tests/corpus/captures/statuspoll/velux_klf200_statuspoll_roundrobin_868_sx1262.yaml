id: velux_klf200_statuspoll_roundrobin_868_sx1262
description: >
  2026-10-05 passive capture of a VELUX KLF 200 gateway in normal use at 868 MHz, heard by the
  reporter's own SX1262 monitor next to it (issue #98). 24 minutes, nine io devices (windows and
  roller shutters), every frame as heard. The gateway sends the same unauthenticated read to each
  device in turn: CMD_PRIVATE (0x03) with data 01 FE 01 01 01 01 01 01 01 00 (function 0x01,
  functional-parameter mask FE, one 01 per parameter). Polling rounds start about every 45 s, one to
  five devices per round about 0.7 s apart; eight devices are reached roughly every two to four
  minutes, and one low-power device (CTRL1 LOW_POWER, the long wake-up preamble) in every round with
  up to six tries. The devices answer with CMD_PRIVATE_RESP (0x04), flags 2D, main parameter 00 00
  (open) or C8 00 (closed). One device challenges the poll; the 0x3C challenges and the gateway's
  0x3D answers are not in this file because the log masks their MAC bytes. Replies the monitor
  could not parse (the low-power device's, about a second after each of its requests) are not
  included. No CMD_STATUS_UPDATE (0x71) or its acknowledgement (0x72) was heard in the 24 minutes,
  a window's rain sensor being sprayed in that time included. Channels rotate per poll. Node IDs
  are replaced (none of the IDs in this file belongs to the reporter's devices); the gateway
  appears as C0FFEE and the window that was sprayed as 8A2C4E.
