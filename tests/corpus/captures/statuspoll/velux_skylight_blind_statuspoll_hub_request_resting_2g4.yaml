id: velux_skylight_blind_statuspoll_hub_request_resting_2g4
description: >
  The Home IO Control hub's own status read (03 00 00, START and LOW_POWER, behind the long wake train) sent by a bench tool to a VELUX skylight blind resting at 47 %. The first try draws no reply; the second is answered with a 14-byte 0x04: stopped (flags 05), constant 60, target 5E00 and current 5E1F (47.0 % and 47.1 %), remaining travel 1 s, last commander 4D84A6, then 01 00 00. The reply's SFD follows the request's end by about 2.7 ms. The request and train are the bench tool's commanded ones (the trace holds the command and the co-processor's tx_done), the reply is received.
source:
  device: "A bench tool on a Kite nRF52840 (Maser228) sending as node C0FFEE to a VELUX skylight blind 516B10 on 2.4 GHz, the same installation as the KLR 200 4D84A6, heard and sent through Kite's Bridle link"
