id: velux_sml_statuspoll_queued_by_remote_sx1262
description: >
  Five ordinary status reads (CMD_PRIVATE 0x03, function 0x03) of a VELUX SML roller shutter that is
  queued behind a second shutter on the same KUX 110, after a press of the shutter's own KLI 310 remote
  (issue #230). The remote's close EXECUTE (a 1W frame, first frame; the hub heard it and followed the
  linked shutter) is followed 2 s later by the first read. Every reply carries status byte 03 (state 3,
  waiting for power), the shutter at 0 %, the target 100 % and a remaining time of 5 s that does not
  count down; the trailing node id C1 84 6D is the KLI that commanded it last.
  The log of this run ends while the shutter still waits, after the fifth reply: a reply at rest is not in
  the capture. The second and third bursts of the same press, and the read that collided with the third
  (no reply), are left out.
  t_ms are from the log line timestamps (the KLI frame at 09:35:02.655).
