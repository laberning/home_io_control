id: velux_sml_statuspoll_queued_by_hub_sx1262
description: >
  The hub's own close command to a VELUX SML roller shutter that is queued behind a second shutter on the
  same KUX 110, and the six ordinary status reads (CMD_PRIVATE 0x03, function 0x03) that follow it
  (issue #230). The shutter rested at 75 % and the new target is 100 %. The command is the 8-byte EXECUTE
  with the speed block; its acknowledgement carries status byte 03 (result code 0, state 3, waiting for
  power). The first five read replies carry 03 too, with the position at 75 %, the target 100 % and a
  remaining time that stays at 5 s (00 05) over 20 s, so it does not count down while the shutter waits.
  The sixth, 15 s after the fifth, carries 05 (state 5, done) with the shutter at 100 %: it had run its
  move between the two reads.
  The 0x3C CHALLENGE_REQ and the hub's 0x3D response between the command and its acknowledgement are
  omitted: their payloads are masked by this project's own redaction before the log is written. The
  gaps between the reads are the hub's: 3 s three times, then 10 s and 15 s, the back-off of a remaining
  time that does not fall. t_ms are from the log line timestamps (the command TX at 09:23:01.441).
