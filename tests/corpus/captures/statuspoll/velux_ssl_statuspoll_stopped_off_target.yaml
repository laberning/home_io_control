id: velux_ssl_statuspoll_stopped_off_target
description: >
  Status-poll replies (0x04, 23 bytes) from two VELUX SSL solar roller shutters that come to rest
  a little off their end target and say so: the STOPPED flag is set (state 0x05) while current and
  target differ by 119 and 171 raw (0.23 % and 0.33 %). Issue #151 (@Kai9555), logged by the
  reporter's own hub 7A3F21 (soft-PHY radio, IOHOME_FRAME_LOG, current main on 2026-10-26), all on
  868.95 MHz. F06E93 after an open repeats the same reply on every poll (frames 0 and 2, 10 s
  apart). FFD95B approaches its open target (frame 1, moving) and lands exactly on it (frame 3);
  after a close it rests 171 raw short of closed (frames 4 and 5, 9 s apart). The polls these answer are in the log too and are left
  out here. t_ms are from the log line timestamps, relative to 09:14:59.157.
source:
  device: "VELUX SSL solar roller shutters F06E93 ('Badezimmer OG') and FFD95B ('Kinderzimmer'), paired two-way to the reporter's hub 7A3F21"
  captured_with: sx1262
  firmware: "main (2026-10-26)"
  date: 2026-10-26
  origin: github-issue
  issue: "https://github.com/laberning/home_io_control/issues/151"
key: unknown
