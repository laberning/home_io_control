id: somfy_pergola_louver_statuspoll_replies_sx1262
description: >
  Seven full status-poll replies (0x04, 23 bytes) from a Somfy bioclimatic pergola (io type
  0x1D), PR #157 (@piitaya), logged by the reporter's hub itself (Heltec V3 / SX1262, IOHOME_FRAME_LOG)
  earlier on 2026-10-06 than the session in
  tests/corpus/captures/exchange/somfy_pergola_louver_exchange_open_close_position_stop_sx1262.yaml,
  on CH1, CH2 or CH3 (not recorded per frame, so there is no freq and no timing). Main parameter
  0x0000 is open and 0xC800 closed. Two behaviours the docs rest on: the louvres can rest a
  fraction of a percent off their target (rows 3 and 4), and after a STOP the target can read
  0xD200 with no usable position (row 5). Positions are the 16-bit values divided by 512 and were checked
  by arithmetic; the state and flags readings are the reporter's. The polls these answer are not
  in the log.
