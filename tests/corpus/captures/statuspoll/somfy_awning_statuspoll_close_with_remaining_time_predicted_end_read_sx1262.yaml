id: somfy_awning_statuspoll_close_with_remaining_time_predicted_end_read_sx1262
description: >
  A whole move of a Somfy Sunea io awning, from the close command to the report that it is at
  rest: the hub sends EXECUTE, then polls the position with a single-try 0x03 every 3 s while the
  awning moves. Every moving report carries the awning's own remaining-time count (bytes 15..16
  of the 23-byte reply): 15, 12, 9, 6, 3 s, falling by one per second. When the count reads 3 s the
  hub aims its next read at the predicted end instead of 3 s ahead: the one read is sent 4 s later
  (count plus one second), 23.3 s after the command, and finds the awning at rest on its target
  (state 0x05, current = target = 0x0000, count 0). The poll that would have been due 1 s before
  that read is skipped. Bench capture 2026-11-13: Somfy Sunea io awning, Heltec V3 (SX1262), hub
  firmware with the predicted-end read. The awning moved from about 50 % to closed.
  t_ms are the on-air start of each burst (preamble included), decoded from a software-defined-radio
  recording of the move; the hub's own log shows the same frames and the same 3 s cadence.
