id: velux_ssl_statuspoll_silent_while_moving
description: >
  The status polls after a two-way set-position command (io 13 %) to a VELUX SSL solar roller
  shutter, issue #114 (@michelpa), Heltec V3 / SX1262 hub E3F1D3, device entry `low_power: true`
  (1024-byte preamble). The command itself is
  tests/corpus/captures/exchange/velux_ssl_exchange_set_position_ack_stale_target.yaml; the first
  poll here goes out 3.3 s after it. The poll scheduler's settle poll (one try) and the next two
  polls (three tries each, after 5 s and 15 s backoff) drew no frame at all while the shutter was
  moving or had just stopped: seven unanswered 1024-byte frames, ~1.6 s of airtime on 868.95 MHz.
  The third try of the third poll, 25 s after the first, was answered directly (no challenge) with
  the stopped position: current = target = 13 %, last command from this hub (E3F1D3), originator
  0x01. Same no-answer-while-moving behaviour as the STOP in
  tests/corpus/captures/exchange/velux_ssl_exchange_stop_mid_motion_unanswered.yaml. t_ms are from
  the log line timestamps (first poll 11:16:31.305).
