id: somfy_izymo_dimmer_enrollment_add_controller_with_mac_sx1276
description: >
  This project's own hub sending CMD 0x30 (1W add-controller) with with_mac=true -- the 35-byte
  form with the out-of-length MAC trailer, matching reference_1w_vectors/
  reference_1w_enrollment_add_controller_kat.yaml's shape rather than the no-MAC 29-byte form every other real
  capture this project holds uses (see that vector's sibling capture,
  somfy_smoove_enrollment_add_and_remove_controller_sx1276.yaml). Companion to that capture: this one
  pins the other side of create_1w_add_controller()'s `with_mac` parameter against real hardware.
  A factory-reset Izymo dimmer accepted this frame during enrollment and remained controllable
  (open/close) afterward, so both shapes are confirmed safe to send.
