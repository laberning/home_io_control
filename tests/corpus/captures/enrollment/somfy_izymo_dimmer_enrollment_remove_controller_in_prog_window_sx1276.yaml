id: somfy_izymo_dimmer_enrollment_remove_controller_in_prog_window_sx1276
description: >
  This project's own hub un-enrolling its emulated 1W controller (0x39 alone, class-addressed, 4 copies) from a
  Somfy Izymo dimmer while the Izymo was in its PROG association window. The Izymo blinked during the remove and
  ignored the 1W Close (EXECUTE, light class, 4 copies) the same controller identity sent 54 s later. The
  identical remove sent with no PROG window open changed nothing: the Izymo kept obeying the same controller's
  Close and Open. So a standalone 0x39 removed this 1W controller only while the receiver was in its programming
  mode. The controller had been enrolled with this project's enrollment gesture (0x39 then 0x30) and controlled
  the light beforehand. The MACs of the 0x39 and EXECUTE frames are re-keyed to the corpus key.
