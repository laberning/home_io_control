id: somfy_smoove_enrollment_prog_press_on_air
description: >
  A short press of the remote's PROG button, captured on the air with an SDR: CMD_ONEWAY_REMOVE_CONTROLLER (0x39)
  and CMD_ONEWAY_ADD_CONTROLLER (0x30) to all devices, then CMD_WRITE_PRIVATE (0x20) frames; every frame sent four
  times back to back with a 13.2 ms preamble, on channel 2 (868.95 MHz), no low-power flag. The add's wrapped key and
  every MAC were re-keyed to the public corpus key before the first commit; some copies were not decoded and are
  missing here.
