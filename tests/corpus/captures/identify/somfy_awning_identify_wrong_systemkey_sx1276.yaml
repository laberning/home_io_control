id: somfy_awning_identify_wrong_systemkey_sx1276
description: >
  Live identify_device (CMD_IDENTIFY 0x1E) request against the Patio Awning. The device answers
  directly with CMD_ERROR_RESP/WRONG_SYSTEMKEY, with no challenge round-trip at all: unlike
  every other authenticated command in this corpus, this exchange completes on the first reply
  (classify_exchange_first_response() sees a non-0x3C frame and treats it as COMPLETE_DIRECT).
  The same system key authenticates rename and force-open moments later in the same session, so
  this is not a genuine key mismatch — it's the device's stock/quirk error reply to a command it
  doesn't fully implement. CONFIRMED (2026-07-16, visually observed across three separate
  identify calls, byte-identical each time): the awning physically jogs despite the error
  reply, validating identify_device's deliberate design choice to treat CMD_ERROR_RESP as
  success for this action.
