id: somfy_smoove_oneway_dim_close_extended_fp
description: >
  1W EXECUTE(0x00) targeting light (0001BF), sent by the awning's Smoove remote while dim-adjusting the newly-enrolled Izymo. 25 bytes total (CTRL0 declares length 25) with FOUR functional parameters (FP1..FP4 = 80 D3 00 00), not the two-FP/23-byte minimum this project's own create_1w_execute_command emits; the same 4-FP / FP1=0x80 shape appears in somfy_smoove_oneway_hold_to_dim_sx1276 (EXECUTE frames to 0001BF). main decodes as the documented CLOSE (C800) encoding, matching this project's table even though the physical action was a dim gesture, not a cover close. Whether the Izymo requires the longer form to accept a command from an enrolled hub controller, versus only ever sending it, is not yet established.
source:
  device: "Somfy 1W remote (node 9D6085), awning's Smoove, enrolled onto the Izymo LED dimmer receiver after a factory reset"
