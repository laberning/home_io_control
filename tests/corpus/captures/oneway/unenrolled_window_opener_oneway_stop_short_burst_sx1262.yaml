id: unenrolled_window_opener_oneway_stop_short_burst_sx1262
description: >
  This project's own hub sending one 1W STOP burst from an identity no device has enrolled (node 4B7A96,
  class window_opener, manufacturer somfy), captured on the air with an SDR on all three channels, not taken from the
  hub's TX log. Board: Heltec WiFi LoRa 32 V3 (sx1262). Shape: `low_power: false`: four short copies. The build used the public corpus key as its system key, so
  every MAC verifies under it and the bytes are exactly what was on the air. Measured: 4 copies, all on channel 2
  (868.95 MHz); preambles 10.1, 10.1, 10.1, 10.1 ms; gap from the end of one copy to the start of the
  next 49.7, 49.5, 49.6 ms (the code waits ONEWAY_BURST_INTERVAL_MS = 40 ms plus the busy check
  and transmit setup).
