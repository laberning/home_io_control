id: unenrolled_window_opener_oneway_stop_short_burst_sx1276
description: >
  This project's own hub sending one 1W STOP burst from an identity no device has enrolled (node 4B7A96,
  class window_opener, manufacturer somfy), captured on the air with an SDR on all three channels, not taken from the
  hub's TX log. Board: Heltec WiFi LoRa 32 V2 (sx1276). Shape: `low_power: false`: four short copies. The build used the public corpus key as its system key, so
  every MAC verifies under it and the bytes are exactly what was on the air. Measured: 4 copies, all on channel 2
  (868.95 MHz); preambles 10.2, 10.2, 10.2, 10.2 ms; gap from the end of one copy to the start of the
  next 47.1, 47.4, 47.3 ms (the code waits ONEWAY_BURST_INTERVAL_MS = 40 ms plus the busy check
  and transmit setup).
