id: somfy_smoove_am_oneway_open_in_both_modes_sx1262
description: >
  Up button of a Somfy Smoove 1 A/M io wall switch (5DA5A0), pressed once with the slider on M and once on
  A. Apart from the rolling sequence and the MAC the two EXECUTE(0x00) OPEN frames are the same: ACEI
  0x47, no FF xx FF trailer. An ordinary press does not carry the A/M state, so it is not an A/M report.
  Each press is followed by two WRITE_PRIVATE(0x20) bursts, identical in both modes as well (M:
  02 FF 01 43 00 0E 00 00 then 02 FF 01 43 00 05 FF 00; A: the same), left out here because they carry no
  intent.
