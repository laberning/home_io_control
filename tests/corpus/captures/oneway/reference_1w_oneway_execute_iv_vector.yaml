id: reference_1w_oneway_execute_iv_vector
description: >
  CMD 0x00 (execute) 1W frame carrying a STOP main parameter, published as the worked
  initial-value example in Velocet/iown-homecontrol's docs/linklayer.md ("Initial Value
  generation"), CC0-1.0. The document states the resulting IV explicitly:

    Payload:        00 01 43 D2 00 00 00      (7 bytes, padded to 8 with 0x55)
    Sequence:       0599
    IV:             000143D2000000550500059955555555

  This project independently recomputed that IV before ingest and reproduces it byte-for-byte,
  including the checksum bytes 0x05 0x00 at IV offsets 8-9, using its existing compute_checksum().
  The vector therefore pins the **CMD 0x00 MAC span**: the checksummed data is the entire payload
  from the command byte through fp2 (cmd + originator + ACEI + main[2] + fp1 + fp2 = 7 bytes),
  stopping before the sequence. The sequence is not frame data — it enters only at IV bytes 10-11,
  never the checksum, which docs/linklayer.md states in prose and this vector confirms.
  Contrast reference_1w_enrollment_add_controller_kat, where CMD 0x30's span is cmd + enc_key only: the span
  is per-command and must not be generalised.

  **The MAC in this frame is a placeholder, not a real signature.** 123456789ABC is the value the
  source document uses throughout as filler (it appears identically as the challenge in the same
  page's 2W examples), and no controller key is given for this frame, so nothing here can verify
  a MAC. Use it for framing and IV construction only — reference_1w_enrollment_add_controller_kat is the
  vector with a genuine, recomputed MAC. crc_ccitt() over the frame body does confirm the trailing
  2 bytes, so the frame is otherwise well-formed and complete.
source:
  device: "Documentation example — 1W controller node 385762 (not a physical device)"
  captured_with: other
  firmware: null
  date: 2026-08-10
  origin: reference-material
  issue: "https://github.com/Velocet/iown-homecontrol/blob/main/docs/linklayer.md"
key: unknown
frames:
  - dir: rx
    freq: 868950000
    hex: "F6 00 00 00 3F 38 57 62 00 01 43 D2 00 00 00 05 99 12 34 56 78 9A BC 5F B0"
    crc: present
    note: >
      cmd=EXECUTE(0x00), typed broadcast to all (dst=00003F), src=385762, originator=0x01,
      ACEI=0x43 (level 2), main=0xD200 (STOP), fp1=0, fp2=0, sequence=0x0599,
      MAC=123456789ABC (document placeholder — not a real signature)
expect:
  frames:
    - {cmd: 0x00, start: true, end: true, protocol: 1w}
  oneway:
    intent: STOP
    target_type: 0
    originator: 0x01
    acei: 2
