id: wind_sensor_oneway_favorite_rain_originator_sx1276
description: >
  Overheard 1W EXECUTE broadcast from a real combined wind/rain protection station (FAVORITE,
  originator=rain_sensor, priority=protection_sensor), targeting all (00003F). Community capture
  from issue #27 (Skamba) — the first real-hardware confirmation of ORIGINATOR_RAIN_SENSOR (0x02)
  in this project's corpus; every prior wind/rain-station capture
  (wind_sensor_oneway_execute_sx1276.yaml and its two siblings) is originator=wind_sensor and
  intent=SECURED_TARGET, so this is new on two axes at once — a different originator value and a
  different EXECUTE intent (FAVORITE, not SECURED_TARGET) — plus it's the first capture of this
  device family sourced from a community report rather than the maintainer's own hardware. The
  same physical sensor (node 495DE8) also produced a SECURED_TARGET/originator=wind_sensor
  broadcast minutes later in the same session (see
  wind_sensor_oneway_favorite_wind_originator_sx1276.yaml) — one station reporting two different
  trigger conditions via the same originator byte, confirming the decode distinguishes them
  correctly on a real device rather than only in isolated single-value tests.
