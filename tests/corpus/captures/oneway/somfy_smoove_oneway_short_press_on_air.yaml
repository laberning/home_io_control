id: somfy_smoove_oneway_short_press_on_air
description: >
  A short press of the remote's UP button, captured on the air with an SDR (not from a receiver's log). Every
  frame is sent four times back to back, each copy with a 13.2 ms preamble and 4 to 7 ms (mostly about 4 ms)
  between one copy's end and the next copy's start; some copies were not decoded and are missing here. The press
  is: EXECUTE to the device class, EXECUTE to all devices with the same sequence, two CMD_WRITE_PRIVATE(0x20)
  frames, and an EXECUTE to the class with the next sequence, all on channel 2 (868.95 MHz), about 0.5 s in all.
  No copy carries the low-power flag and none has a long wake-up preamble. Every MAC was re-keyed to the public
  corpus key before the first commit.
source:
  device: "Somfy Smoove io remote (node 9D6085), paired to a Somfy Sunea io awning (powered off for the capture)"
  captured_with: other
  firmware: "SDR on-air capture, all three channels"
  date: 2026-11-21
  origin: own-hardware
  issue: null
