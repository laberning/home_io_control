id: unenrolled_window_opener_oneway_stop_low_power_burst_sx1262
description: >
  This project's own hub sending one 1W STOP burst from an identity no device has enrolled (node 4B7A95,
  class window_opener, manufacturer somfy), captured on the air with an SDR on all three channels, not taken from the
  hub's TX log. Board: Heltec WiFi LoRa 32 V3 (sx1262). Shape: `low_power: true`: the wake-up preamble and the low-power flag on copy 1, three short copies. The build used the public corpus key as its system key, so
  every MAC verifies under it and the bytes are exactly what was on the air. Measured: 4 copies, all on channel 2
  (868.95 MHz); preambles 213.4, 10.1, 10.1, 10.1 ms; gap from the end of one copy to the start of the
  next 49.5, 49.5, 49.7 ms (the measured build waited 40 ms between copies, on top of the busy check
  and transmit setup).
