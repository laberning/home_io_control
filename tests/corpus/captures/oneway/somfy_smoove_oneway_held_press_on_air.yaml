id: somfy_smoove_oneway_held_press_on_air
description: >
  The remote's UP button held for about 2.5 s, captured on the air with an SDR. It starts like a short press, then
  sends one CMD_WRITE_PRIVATE(0x20) frame every 250 ms while the button is down, each with a new sequence and four
  copies back to back (13.2 ms preamble each), and closes with an EXECUTE followed by one more
  CMD_WRITE_PRIVATE(0x20) frame. All on channel 2 (868.95 MHz); no low-power flag, no long wake-up preamble. Some
  copies were not decoded and are missing here. Every MAC was re-keyed to the public corpus key before the first
  commit.
