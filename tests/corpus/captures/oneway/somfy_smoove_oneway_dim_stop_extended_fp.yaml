id: somfy_smoove_oneway_dim_stop_extended_fp
description: >
  1W EXECUTE(0x00) targeting light (0001BF), sent by the awning's Smoove remote releasing the dim button on the newly-enrolled Izymo. 25 bytes total (CTRL0 declares length 25) with FOUR functional parameters (FP1..FP4 = 80 D2 00 00), not the two-FP/23-byte minimum this project's own create_1w_execute_command emits -- see analysis/oneway_1w_support_plan.md and reference/iown-homecontrol (constants doc + PRODUCTION_READINESS.md finding V22 + io-homecontrol.ksy). main decodes as the documented STOP (D200) encoding, matching this project's table even though the physical action was releasing a dim-hold, not a cover stop.
