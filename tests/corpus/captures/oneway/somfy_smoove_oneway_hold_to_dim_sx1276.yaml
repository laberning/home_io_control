id: somfy_smoove_oneway_hold_to_dim_sx1276
description: >
  A long (held) press of the remote's OPEN button: EXECUTE(0x00) OPEN, then a stream of
  CMD_WRITE_PRIVATE(0x20) frames roughly every 300-500ms while the button stays down, ending
  with an explicit EXECUTE STOP the instant the button is released. Physically, the dimmer
  ramped up and held at whatever brightness it reached when STOP arrived. A short press (see
  somfy_smoove_oneway_open_sx1276.yaml) sends only the bare EXECUTE frame, no
  WRITE_PRIVATE stream, no STOP -- the device free-runs to full brightness on its own.

  0x20's payload is not decoded anywhere in this project (see proto_commands.h's FAVORITE
  section for the one other confirmed use of this command, a single-shot "My" button press).
  Two structural observations from this capture, offered as hypotheses rather than confirmed
  semantics: the first beacon after OPEN carries a distinct sub-byte (0x0C) that every later
  beacon in the same hold replaces with 0x05 -- cross-confirmed by an unrelated device/session's
  somfy_smoove_oneway_write_private_a.yaml, which also uses 0x0C on what looks like a
  gesture-starting frame -- and the last two payload bytes climb by roughly one count per
  beacon (0x02, 0x05, 0x06, 0x08, 0x0A, 0x0B here), consistent with a hold-duration or ramp-step
  tick. Neither is asserted in `expect` below, only structural fields (cmd/start/end/protocol).

  Not asserting oneway.intent (build.py's expect.oneway is one intent per whole capture, and
  this capture spans both an OPEN and a STOP).

  Confirmed by direct experiment (hub-issued EXECUTE OPEN, then a timed EXECUTE STOP, no
  WRITE_PRIVATE frames sent at all): the dimmer ramps up and locks at whatever brightness it
  reached the instant STOP arrives, exactly like a real held press. WRITE_PRIVATE is not
  required for the ramp-and-lock behavior itself -- the dimmer's ramp is driven purely by
  elapsed time between OPEN and STOP. The beacon stream this capture pins is therefore most
  likely the remote deciding locally how long its button has been held (to know whether to ever
  send a STOP at all), not something the receiving device needs to see.
