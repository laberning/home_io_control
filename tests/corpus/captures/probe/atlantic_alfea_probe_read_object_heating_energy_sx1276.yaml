id: atlantic_alfea_probe_read_object_heating_energy_sx1276
description: |
  An Atlantic Alfea Duo Extensa A.I. heat pump (node type 0x16, subtype 1) answering the `read_object`
  diagnostic probe at index 30 (the Atlantic heat pump recipe) and offset 0x0023, its heating energy
  counter, on the reporter's LilyGO T3 V2.1 (SX1276) hub (issue #244, log taken 2026-11-19 18:14:05-18:14:07
  local time). Addresses masked: hub A1B2C3, heat pump D1E2F3.

  The read is the one a TaHoma Switch was captured making on the same heat pump:
    - CMD_TRANSFER_OPEN (0x46) of object 0x1001 in class 0x0C at offset 0x0023, answered empty
      (handle 0, status 0, length 0): this open only prepares the next one;
    - the same open of object 0x1002, answered with handle 0x2C, status 1 (adapted), length 3;
    - one CMD_UNKNOWN4A_REQ (0x4A) for chunk 1, answered with `80 2C C7`: the marker byte 0x80 and
      0x2CC7 = 11463 kWh, matching the yearly totals of the TaHoma app;
    - the close (chunk 0) and its echo.
  Every request was answered on the first try, with no challenge. The hot-water counter at offset 0x0025
  read the same way 14 s later gave `80 24 C0` = 9408 kWh.

  Own installation: the system key is known to the reporter but not published; no frame here is
  authenticated.
