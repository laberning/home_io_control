id: somfy_awning_probe_private2_favorite_after_reprogram_lr1121
description: >
  Step 2 Q3c, the decisive test: same probe as
  somfy_awning_probe_private2_favorite_lr1121.yaml (modifier 0x00), run again after the awning's
  stored My position was physically reprogrammed to a new position via its remote (move to new
  position, then save-as-My) in between. Reply data=6D D4 00 00 00 -- byte-identical to the
  pre-reprogram baseline. Combined with four other identical readings the same day across two
  devices and two modifiers (see somfy_awning_probe_private2_vent_lr1121.yaml and both
  tests/corpus/captures/probe/somfy_izymo_dimmer_probe_private2_{favorite,vent}_lr1121.yaml fixtures), this is now five consistent
  identical readings including one spanning an actual change to the specific stored value the
  hypothesis predicted would move it. This falsifies, for these two devices under this decode,
  the stored-My-position-readback hypothesis for CMD_PRIVATE2 (0x0C): the value did not track a
  real change to the exact setting it was hypothesized to reflect.
source:
  device: "Somfy Sunea IO awning motor (Patio Awning, node 30E1F2), probed with CMD_PRIVATE2 (0x0C) long form, modifier 0x00 (favorite/My), after physically reprogramming the stored My position"
  captured_with: lr1121
  firmware: null
  date: 2026-08-16
  origin: own-hardware
  issue: null
key: corpus
frames:
  - dir: tx
    t_ms: 0
    freq: 868950000
    hex: "4E 20 30 E1 F2 C0 FF EE 0C D4 00 80 D8 00 00"
    crc: absent
    note: "cmd=PRIVATE2(0x0C), data=D4 00 80 D8 00 00 -- long form, modifier 0x00, post-reprogram."
  - dir: rx
    t_ms: 282
    freq: 868950000
    hex: "8D 00 C0 FF EE 30 E1 F2 0D 6D D4 00 00 00"
    crc: absent
    note: >
      cmd=PRIVATE2_RESP(0x0D), data=6D D4 00 00 00 -- unchanged from the pre-reprogram reading.
      The decisive falsification: this exact byte sequence did not move in response to a real
      change of the specific stored value it was hypothesized to reflect.
expect:
  frames:
    - {cmd: 0x0C, start: true, end: false, protocol: 2w}
    - {cmd: 0x0D, start: false, end: true, protocol: 2w}
