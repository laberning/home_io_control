id: velux_window_probe_limitation_rain_sx1262
description: >
  2026-10 limitation read (CMD_LIMITATION_STATUS_REQ 0x25, minimum then maximum) answered by a VELUX
  INTEGRA roof-window actuator with a wired rain sensor, once dry and once with the sensor wetted by
  a spray bottle (about 30 s apart), captured by the reporter's own SX1262 hub through the
  limitation probe_sweep of issue #98. Dry: minimum 0 % (00 00), maximum 100 % (C8 00). Wet:
  minimum 93 % (BA 00), the window's ventilation position; maximum unchanged. The originator
  (data[3]) and remaining time (data[4]) stay 00 in the wet reply, so the rain state is carried by
  the value alone. The window answered without an authentication challenge. The requests were not
  logged, only the replies; node IDs are replaced (the hub and window IDs in this file are not the
  reporter's).
