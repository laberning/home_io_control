id: somfy_awning_probe_private2_short_favorite_sx1262
description: >
  The awning's reply to the private2_short probe, index 0 (request D8 00 00 00), with the My
  position saved with the remote at about 36 %. The reply data 05 48 78 00 00 carries 48 78 where
  the long-form probes in this directory carry D4 00; read as a main parameter on the
  0x0000-0xC800 scale 0x4878 is 36 %. The awning stood at 0 % at the time, so the value is not
  its current position. Read before the My position was changed; compare the _after_reprogram and
  _restored captures.
  The awning challenged the request first; the challenge pair is not kept here, the reply
  followed the answered challenge.
