id: velux_window_probe_private_fn_rain_state_at_rest_sx1262
description: >
  2026-10-04 private_fn sweep (function IDs 0x00-0x0E, CMD_PRIVATE 0x03) of a VELUX INTEGRA
  roof-window actuator with a wired rain sensor, run twice about a minute apart by the reporter's own
  SX1262 hub (issue #98): first with the window dry, then at rest in the rain-limited state after
  the sensor was sprayed. Every reply is a CMD_PRIVATE_RESP, data[0]=05 (stopped). The second sweep
  differs from the first at fn 0x00 (target selector D8 01 instead of 00 00), fn 0x01 (BA 00, 93 %),
  fn 0x03 (record: D8 01, BA 00, master 00 00 32, originator 02), fn 0x04 (master 00 00 32),
  fn 0x05 (02 00) , fn 0x09 (D8 01) and fn 0x0E (BA 00); fn 0x0A and 0x0B stay 00 00 and C8 00, so no
  private function holds the limit itself. Two opens sent afterwards both ended at 93 % (position
  93 %, target 93 %, no error reply). The requests were not logged, only the replies, which stand
  in function-ID order; node IDs are replaced (the hub and window IDs in this file are not the
  reporter's), and the hub ID the log had masked is the controller address inside the replies.
