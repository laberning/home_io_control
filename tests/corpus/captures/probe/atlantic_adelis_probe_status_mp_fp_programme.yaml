id: atlantic_adelis_probe_status_mp_fp_programme
description: >
  An Atlantic Adelis 2 Digit towel dryer (node BD684B) in PROG answering the CMD_PRIVATE (0x03)
  function-0x01 status read of the `status_mp_fp` probe, on the reporter's SX1276 hub C0FFEE (issue #202,
  comment of 2026-11-08), once in a comfort period at 19 C, once in a comfort period at 18 C and once in
  an eco period at 15.5 C, each with the display showing the temperature in force. The read was
  challenged (authenticated); the second comfort read and the eco read needed a second try. Only the
  replies were logged (stage=probe_rx), so the requests and the challenge exchange are not in this
  capture.

  Reply layout as in tests/corpus/captures/probe/atlantic_adelis_probe_status_mp_fp.yaml: status byte
  0x2D, then the main parameter, then the two functional-parameter index echoes (both 0x00).
    - Comfort period (19 C, then 18 C): main parameter 0xFC05, the heating level the standard heating
      level table names comfort.
    - Eco period (15.5 C): main parameter 0xFC02, the level the table names eco.
  The comfort replies are identical at two display temperatures: the main parameter names the period,
  not the temperature.

  Community capture: no system key; the replies carry no authenticated bytes.
