id: velux_klf200_probe_private_function_01_2g4
description: >
  A timed 2.4 GHz io-homecontrol capture: a US VELUX KLF 200 (82E900) sends an unauthenticated 0x03
  with function 0x01 and a 10-byte payload to device 0565E7, as a LOW_POWER START after a wake train
  on channel 20; the device answers with a short 0x04 and no challenge. Home IO Control's own status
  poll uses function 0x03, so this is a probe-form read. The same controller, device and request,
  stamped at 1 us, are in velux_klf200_probe_status_poll_timed_2g4.

  Timing: t_us is the sniffer's micros() when it saw each frame end. That clock advances once per tick
  of 1024 Hz (976.6 us), so every stamp is a whole number of ticks and a difference is good to about
  one tick. The contributor posted the last 26 wake frames (counters 25 .. 0), one tick apart each.
  The wake train's period is not bounded by these stamps.
source:
  device: "US VELUX KLF 200 82E900 polling VELUX device 0565E7 on 2.4 GHz, sniffed with an nRF52840 Feather 802.15.4 sniffer with micros() timestamps (Maser228)"
  captured_with: other
  firmware: null
  date: 2026-09-27
  origin: contributor
  issue: null
key: unknown
phy: io_2g4
psdu_header: "01 69 6F"
t_us_stamp: {at: frame_end, resolution_us: 977}
frames:
  - dir: tx
    t_us: 26367
    wake_train: {frames_captured: 26, first_counter: 25, last_counter: 0, first_t_us: 0, last_t_us: 24414}
    freq: 2450000000
    hex: "52 20 05 65 E7 82 E9 00 03 01 FE 01 01 01 01 01 01 01 00"
    crc: absent
    note: "0x03 function 0x01, START, CTRL1 LOW_POWER"
  - dir: rx
    t_us: 29297
    freq: 2450000000
    hex: "90 00 82 E9 00 05 65 E7 04 2D 60 00 00 80 00 00 00"
    crc: absent
    note: "END; unauthenticated 0x04, no challenge"
expect:
  frames:
    - {cmd: 0x03, start: true, end: false, protocol: 2w}
    - {cmd: 0x04, start: false, end: true, protocol: 2w}
