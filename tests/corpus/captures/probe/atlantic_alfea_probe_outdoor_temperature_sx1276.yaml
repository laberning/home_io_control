id: atlantic_alfea_probe_outdoor_temperature_sx1276
description: |
  An Atlantic Alfea Duo Extensa A.I. heat pump (node type 0x16, subtype 1) answering a read of its
  outdoor temperature entry, offset 0x019B, on the reporter's LilyGO T3 V2.1 (SX1276) hub (issue #244,
  log taken 2026-11-16 20:42:30-20:42:32 local time). The hub ran the reader of the fork that issue #244
  links, which sends the same opens as the Atlantic heat pump recipe. Addresses masked: hub A1B2C3,
  heat pump D1E2F3.

    - CMD_TRANSFER_OPEN (0x46) of object 0x1001 in class 0x0C at offset 0x019B, answered empty;
    - the same open of object 0x1002, answered with handle 0x12, status 1 (adapted), length 3;
    - one CMD_UNKNOWN4A_REQ (0x4A) for chunk 1, answered with `80 00 77`: the marker byte 0x80 and
      0x0077 = 119 tenths, 11.9 degrees;
    - the close (chunk 0) and its echo.

  Over the reporter's captures of 16 and 17 November the entry read between `80 00 72` (11.4) and
  `80 00 93` (14.7), following the outdoor temperature. No value below zero has been seen, so the sign
  of the word is assumed, not observed.

  Own installation: the system key is known to the reporter but not published; no frame here is
  authenticated.
