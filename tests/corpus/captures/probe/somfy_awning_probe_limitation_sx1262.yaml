id: somfy_awning_probe_limitation_sx1262
description: >
  2026-10 limitation read (CMD_LIMITATION_STATUS_REQ 0x25, data selector 00 00) against our own
  mains-powered awning, minimum (selector 0x80) and maximum (selector 0xC0), with the awning at
  three positions: 97 % closed, fully open and fully closed. In each run the request drew a 0x3C
  challenge, the hub answered with 0x3D, and the device then sent the 0x26 reply below (the
  challenge exchange is not recorded here; its bytes are masked in the log). The reply is
  byte-identical at every position: data=05 00 00 00 00 for the minimum and 05 C8 00 00 00 for the
  maximum. Bytes 1-4 follow the layout of the two replies a VELUX window sends with no limitation
  active (00 00 00 00 00 / 00 C8 00 00 00); only data[0] differs (05 here, 00 on the window), and
  it does not follow the selector or the position. The limitation reply carries no position
  information on this device. The first call of a series sometimes drew a final reply only on the
  third try (the hub answered the challenge each time), which is not recorded.
