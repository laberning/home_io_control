id: somfy_awning_probe_private2_short_favorite_after_reprogram_sx1262
description: >
  The same probe as somfy_awning_probe_private2_short_favorite_sx1262 after the awning was moved
  to 25 % and that position was saved as My with the remote. The reply data 05 32 00 00 00 carries
  32 00, which is 25 % on the 0x0000-0xC800 scale and equals the saved position, where the first
  read carried 36 %. The Favorite Position button then drove the awning from 0 % to 25 % and it
  stopped there. The long-form probe stayed at D4 00 after a My change
  (somfy_awning_probe_private2_favorite_after_reprogram_lr1121.yaml); the short form follows it.
  The awning challenged the request first; the challenge pair is not kept here, the reply
  followed the answered challenge.
