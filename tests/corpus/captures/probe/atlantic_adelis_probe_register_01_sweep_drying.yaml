id: atlantic_adelis_probe_register_01_sweep_drying
description: >
  An Atlantic Adelis 2 Digit towel dryer (node BD684B, the reporter's second unit) answering the
  `register_01` diagnostic sweep over 0x00-0x3F while a 30-minute drying run was active, in base mode
  MANUEL, on the reporter's SX1276 hub C0FFEE (issue #202, comment of 2026-11-06). Four sweeps
  (18:36 0x00-0x0F, 18:37 0x10-0x1F and 0x20-0x2F, 18:38 0x30-0x3F), taken while the display's drying
  timer ran from 30 to 27 minutes. Every index was answered; registers the device does not hold are
  answered with no value bytes. Only the answers were logged, in the probe_sweep summary.

  What the frames show, read against tests/corpus/captures/probe/atlantic_adelis_probe_register_01_sweep.yaml
  (the first unit, BB0B50, in boost):
    - 0x013E = 02 during drying (01 during boost on the first unit).
    - 0x0126 = 0x64 (100) during drying, as during boost; 0x0117 = 00 in both.
    - 0x0137 and 0x012A = 02 00 during drying (01 00 during boost).
    - 0x0136 = 03 and 0x0100 = 03: drying leaves the base mode alone.
    - 0x0103 = 0x0138 = 0x00BE (19.0 C in tenths); both units hold the same value in both registers.
    - 0x0115 = 0x07B7 (19.75 C in hundredths).
    - 0x013C = 0x1C (28), with the display between 30 and 27 minutes of drying left; 0x013D = 1E 78
      (30, 120) with a 30-minute drying set; 0x013B = 3C 3C (60, 60) with a one-hour boost set.
    - 0x0119 is ASCII "ADELIS 2 DIGIT" followed by three NUL bytes.

  Community capture: no system key, and no authenticated bytes are included.
