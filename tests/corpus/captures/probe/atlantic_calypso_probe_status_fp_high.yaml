id: atlantic_calypso_probe_status_fp_high
description: >
  An Atlantic Calypso Connecte 200 L heat-pump water heater (node F9CF0F, type 51 subtype 0) answering the
  `status_fp_high` probe (CMD_PRIVATE 0x03, function 0x01, FPI1 00, FPI2 43) from the reporter's SX1276 hub
  C0FFEE in three display states (issue #198, comment of 2026-11-06). Only the answers were logged
  (stage=probe_rx); the requests are not in this capture, and the reads were not challenged.

  Each answer is CMD_PRIVATE_RESP (0x04) with the payload `05 00 <MP hi> <MP lo> 00 43 00 00 00 0C 4A 00`:
  result code 0, the main parameter in place (the target on the relative scale over 20-62 C), FPI1 echo 00,
  FPI2 echo 43 (FP10, FP15 and FP16), then one 16-bit value each:
    - FP10 = 0000;
    - FP15 = 000C: the operating-mode capabilities, bit 2 (away) and bit 3 (boost) set;
    - FP16 = 4A00: the current operating-mode word. Bits 8-9 (boost) read 2 and bits 10-11 (away) read 2, so
      "both off"; bit 14 is set and not understood. All three answers read the same FP16, the heater being at
      rest in each display state.
  The three main parameters are the targets of the three display states: BE 7A = 60.0 C (AUTO), A1 E8 =
  54.0 C (manual, ECO on), C8 00 = 62.0 C (manual, ECO off).

  Community capture: no system key, and no authenticated bytes are included.
