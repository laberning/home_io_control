id: velux_klr200_probe_copy_remote_record_reads_2g4
description: >
  Part of a 2.4 GHz "copy remote" session between two US VELUX KLR 200 remotes on channel 20:
  the factory-reset remote E6FF27 reads records 09, 08 and 07 from the paired remote 4D84A6 with
  0x4A (data 10 00 nn), each request a START after a wake train, and 4D84A6 answers each with an
  END 0x4B that echoes the request and adds 18 bytes; record 07 holds 00 00 0C 00 and the name
  "Kitchen" in UTF-16LE. No challenge: the reads are unauthenticated between these remotes.

  The contributor posted a fragment: the first train has only its last 3 frames (counters 2 .. 0),
  the log carries no timestamps, and the session's other frames are not in it.
source:
