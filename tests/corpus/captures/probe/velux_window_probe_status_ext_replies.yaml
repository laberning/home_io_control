    crc: absent
    note: "`status_ext` (fn 0x03), block 0x00. Motion-state prefix + 0x80 marker + tail 78 00 (= 0x7800 = 60.0% on the position scale; undecoded)."
  - dir: rx
    t_ms: 0
    hex: "96 00 51 3B 34 65 44 C6 04 05 00 D8 03 BA 00 00 00 51 3B 34 01 00 00"
    crc: absent
    note: "`status_ext` (fn 0x03), block 0x03 — compact form: motion-state prefix only, no 0x80 tail. Byte-identical to `private_fn` fn 0x03."
  - dir: rx
    t_ms: 0
    hex: "98 00 51 3B 34 65 44 C6 04 05 00 D8 03 BA 00 00 00 51 3B 34 01 80 C8 00 00"
    crc: absent
    note: "`status_ext` (fn 0x03), block 0x0B. Tail C8 00 = 0xC800 = STATUS_POS_MAX; pairs with the block-0x0A tail 50 00 (40.0%) as a possible min/max position-limit pair (undecoded, dry)."
  - dir: rx
    t_ms: 0
    hex: "90 00 51 3B 34 65 44 C6 04 05 00 00 00 80 78 00 00"
    crc: absent
    note: "`status_ext_fn6` (fn 0x06), block 0x00. data[2..5] zeroed (no position), then 0x80 + tail 78 00. Same tail table as `status_ext`."
  - dir: rx
    t_ms: 0
    hex: "89 00 51 3B 34 65 44 C6 FE 58"
    crc: absent
    note: "`status_ext_fn6` (fn 0x06), block 0x80: CMD_ERROR_RESP (0xFE) result code 0x58 = RESULT_INVALID_FUNCTION_INDEX. Every block 0x80–0x8F answered this; the block space is 0x00–0x0E. END."
  - dir: rx
    t_ms: 0
    hex: "90 00 51 3B 34 65 44 C6 04 05 00 D8 03 80 78 00 00"
    crc: absent
    note: "`status_ext_fn9` (fn 0x09), block 0x00. Target selector D8 03 kept, resolved-position field dropped (shorter prefix), then 0x80 + tail 78 00."
