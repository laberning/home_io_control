id: velux_window_probe_status_ext_replies
description: >
  Extended CMD_PRIVATE (0x03) replies from a Velux INTEGRA roof-window actuator (WINDOW_OPENER,
  node 6544C6), captured by the reporter's own SX126x hub via probe_sweep on issue #98
  (2026-09-01), window parked at its ventilation preset (~7% open). Three probes, all sending
  selector 0x80 and walking the block byte: `status_ext` (function ID 0x03),
  `status_ext_fn6` (0x06), `status_ext_fn9` (0x09).

  Shape (human-verified, see issue #98 probe_findings_2026-09-01.md §3): every reply leads with
  the same motion-state prefix as `private_fn` fn 0x03 —
    data[0..1]  status flags (0x05 = STOPPED)
    data[2..3]  target selector      (D8 03 = POS_FAVORITE + vent modifier)
    data[4..5]  resolved position    (BA 00 = 0xBA00 = 93.0% closed)
    data[6..7]  00 00
    data[8..10] last-command node    (51 3B 34 = the hub)
    data[11]    priority level       (01)
  then, for most block values, a 0x80 marker and a per-block tail; blocks 0x03/0x0C/0x0D omit
  the 0x80 tail (compact form). `status_ext_fn6` zeroes data[2..5]; `status_ext_fn9` keeps the
  target selector but drops the resolved-position field. The tails seen dry (78 00, 50 00,
  C8 00 — position-family values) have no decode. An out-of-range block answers CMD_ERROR_RESP
  result 0x58 = RESULT_INVALID_FUNCTION_INDEX, same as `private_fn` fn 0x0F.

  No TX probe frames were logged by the reporter. Community capture: no system key, HMAC not
  verifiable.
source:
