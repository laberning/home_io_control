id: atlantic_adelis_probe_mode_reads
description: >
  An Atlantic Adelis 2 Digit towel dryer (node BD684B) answering `register_01` reads of registers
  0x0136 and 0x0100 after the reporter set its display to each mode, on the reporter's SX1276 hub
  C0FFEE (issue #202, comment of 2026-11-06). Each answer is CMD_WRITE_PRIVATE_ACK (0x21) echoing
  the four header bytes, then the value. Only the answers were logged (stage=probe_rx); the requests
  and the 0x3C/0x3D handshakes are not in this capture.

  What the frames show, in the order the reporter took them:
    - MANUEL: 0x0136 = 03, 0x0100 = 03.
    - PROG inside a comfort period: 0x0136 = 02, 0x0100 = 02.
    - PROG inside an eco period: 0x0136 = 02, 0x0100 = 02; neither register tells comfort from eco.
    - off, set from the display's main menu: 0x0136 = 00, 0x0100 = 04.
  Value 01 of 0x0136 did not appear. The towel-dryer climate profile reads its mode from 0x0136 with
  this mapping (off 0, PROG 2, MANUEL 3).

  Community capture: no system key, and no authenticated bytes are included.
