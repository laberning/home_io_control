id: velux_sml_probe_execution_state_waiting_then_executing_sx1262
description: >
  Two replies of a VELUX SML roller shutter to the main-parameter status read (`status_mp_fp`:
  CMD_PRIVATE 0x03, function 0x01, FP1-FP7 requested), answered while a second SML shutter on the same
  KUX 110 power supply travelled. The shutter rested at 75 % and was commanded to open. Both replies
  are unchallenged. Reported in issue #230 by martinhladil (his pull request #231 carried the same
  bytes).
    - frame 0, 6 s after the command, the shutter still in place: status 2B = (5 << 3) | 3, waiting
      for power. A read 10 s later drew the same bytes and is not repeated here.
    - frame 1, 20 s after frame 0, the motor just started: status 2C = (5 << 3) | 4, executing. The
      ordinary status read 3 s later reported the shutter moving at 63 %.
  The main parameter is 96 00 in both, the value of the 75 % the shutter rested at (the target was
  0 %); whether it is the current position is not decoded, since a queued reply in
  tests/corpus/captures/probe/velux_sml_probe_status_mp_fp_waiting_for_power.yaml carries 00 00. The value
  after the FPI1 echo 80 (FP1) is 00 00 while waiting and C8 00 while executing; what it means is not
  decoded. Together with tests/corpus/captures/probe/velux_sml_probe_status_mp_fp_waiting_for_power.yaml
  (2D at rest) this covers states 3, 4 and 5 of the KLF 200 API specification v3.18 on one device.
  No ordinary status reply (CMD_PRIVATE 0x03, function 0x03) from a waiting shutter was captured.

  Node IDs are replaced; the frames are unauthenticated and carry no CRC.
