id: somfy_izymo_dimmer_probe_general_info3_lr1121
description: >
  CMD_GET_GENERAL_INFO3 (0x58) probe against our own mains-powered dimmer. Real
  CMD_GET_GENERAL_INFO3_RESP (0x59) reply, 16 data bytes, all zero -- confirms 0x58/0x59 is a
  real, working opcode pair on real hardware, without ever transmitting the unrelated 0x4A
  opcode (see ADR 0024). The all-zero payload gives no further content to decode on this
  device. Contrast with the companion awning capture
  (somfy_awning_probe_general_info3_lr1121.yaml), which answered CMD_ERROR_RESP instead.
