id: velux_window_probe_metadata_replies
description: >
  Metadata / stored-parameter probe replies from a Velux INTEGRA roof-window actuator
  (WINDOW_OPENER, node 6544C6), captured by the reporter's own SX126x hub on issue #98
  (2026-09-01): CMD_GET_INFO1 (0x54) -> 0x55, CMD_GET_INFO2 (0x56) -> 0x57,
  CMD_GET_GENERAL_INFO3 (0x58), and CMD_PRIVATE2 (0x0C) long + short forms -> 0x0D.

  Human-verified (see issue #98 probe_findings_2026-09-01.md §5–§6, and the review pass):
    - GET_INFO2_RESP: data[10]=0x01, data[11]=0x01 -> decode_packed_device_type() =
      (0x01<<2)|(0x01>>6) = 0x04 = WINDOW_OPENER, subtype 0x01. data[0..9] are all zero here
      (no leading ASCII reference string, unlike the Somfy get_info2 replies). data[12..15]
      undecoded.
    - GET_GENERAL_INFO3: the window does not implement it — answers CMD_ERROR_RESP (0xFE)
      result 0x08 = RESULT_ERROR_DURING_EXECUTION, same as a Somfy Sunea awning
      (velux_kig300_probe_capability_burst.yaml shows a Somfy dimmer answering a real 0x59 instead —
      device-dependent).
    - GET_INFO1_RESP: body is 9 zero bytes then 30 03 then 00 00 00; static, no position/limit
      content.
    - PRIVATE2_RESP (0x0D): data[0] = 0x68 is the "bare echo, no value" form (data[2..3] = D4 00
      is the request's own POS_UNKNOWN bytes echoed back). data[0] = 0x00 with a trailing 0x80
      block is the "value present" form. This command returned byte-identical data with the
      window fully open and at the vent preset — it carries stored config, not live state; its
      short form at modifier 0x03 reads back the stored ventilation position (BA 00 = 93%) and
      at modifier 0x0A the vent target selector (D8 03).

  No TX probe frames were logged by the reporter. Community capture: no system key, HMAC not
  verifiable.
