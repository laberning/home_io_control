id: atlantic_adelis_probe_register_01_sweep
description: >
  An Atlantic Adelis 2 Digit towel dryer (node BB0B50) answering the `register_01` diagnostic sweep,
  on the reporter's SX1276 hub C0FFEE (issue #202, comment of 2026-11-04). Each request is an
  authenticated CMD_WRITE_PRIVATE (0x20) read `0C 60 01 <index>` of register 0x01<index>; each answer is
  CMD_WRITE_PRIVATE_ACK (0x21) echoing the four header bytes, then the register's value bytes (none for
  some registers). Only the answers were logged, in the probe_sweep summary, so the requests and the
  0x3C/0x3D handshakes are not in this capture. Every index of every sweep was answered.

  Five sweeps, in time order: 17:55 over 0x00-0x0F, then 18:15 over 0x30-0x3F, 18:17 over 0x00-0x0F,
  18:18 over 0x10-0x1F and 18:19 over 0x20-0x2F. The reporter posted the 18:xx sweeps under the note that
  the display showed BOOST after a setpoint change from the climate entity. The 17:55 sweep was taken
  without boost or drying, in manual mode.

  What the frames show:
    - Registers 0x0100-0x010E read the same at 17:55 and 18:17. 0x0103 = 0x00C3 (19.5 C in tenths) and
      0x0104 = 0x0023 (3.5 in tenths) equal FP12 and FP13 of the status read in
      tests/corpus/captures/probe/atlantic_adelis_probe_status_mp_fp.yaml, decoded by us against these
      registers.
    - 0x010F (and 0x0110 at 18:18) carry 8 bytes ending in 04 02 0B EA 07; we read them as the
      device's clock (seconds, minutes, hours, day 4, weekday 2, month 11, year 2026). Only the first
      three bytes change between 17:55 and 18:17.
    - 0x0119 is ASCII "ADELIS 2 DIGIT".
    - 0x0132-0x0134 each hold two 7-byte records `<day> <t1> <t2> <t3> <t4> 00 00`, days 1-6; the day-0
      record sits at the end of 0x0131 and again in 0x011E. Read as quarter hours from midnight with day
      0 = Monday, the records match the weekly program the reporter read off the device's display
      (posted in the same comment). The weekday 2 in the clock is consistent with that numbering
      (2026-11-04 was a Wednesday).
    - Read during the BOOST period: 0x013E = 01, 0x0126 = 0x64 (100), 0x0137 = 0x0001. No read of these
      registers without boost exists, so nothing here says which of them encodes boost.

  Community capture: no system key, and no authenticated bytes are included.
