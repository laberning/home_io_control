    crc: absent
    note: >
      Session 1 (window fully open): `private_fn` fn 0x09 reply. data=05 00 00 00 00 00 — the
      active-target-selector field (data[2..3]) reads 00 00 = no target / fully open. Contrast
      the Session-2 fn 0x09 reply below (D8 03 = vent selector).
  - dir: rx
    t_ms: 0
    hex: "8E 00 51 3B 34 65 44 C6 04 05 00 BA 00 00 00"
    crc: absent
    note: >
      `private_fn` fn 0x01 reply. data=05 00 BA 00 00 00 — a single scalar field: 0xBA00 = 93.0%
      closed, the resolved ventilation position.
  - dir: rx
    t_ms: 0
    hex: "8E 00 51 3B 34 65 44 C6 04 05 00 D8 03 00 00"
    crc: absent
    note: "`private_fn` fn 0x09 reply, Session 2. Active-target selector = D8 03 (POS_FAVORITE + vent modifier)."
  - dir: rx
    t_ms: 0
    hex: "96 00 51 3B 34 65 44 C6 04 05 00 D8 03 BA 00 00 00 51 3B 34 01 00 00"
    crc: absent
    note: >
      `private_fn` fn 0x03 reply — the full motion-state record: target selector D8 03, resolved
      position BA 00 (93%), 00 00, last-command originator node 51 3B 34 (the hub), priority
      level 01. data[7] (the 01) is where the codec's shipped 0x04 decoder reads its settle
      hint. fn 0x0C returns this record byte-identically (aliased).
  - dir: rx
    t_ms: 0
    hex: "8E 00 51 3B 34 65 44 C6 04 05 00 27 10 00 00"
    crc: absent
    note: "`private_fn` fn 0x07 reply. data[2..3] = 27 10 = 0x2710 = 10000, a constant (identical in the fully-open run); not a position on the 0xC800 scale."
  - dir: rx
    t_ms: 0
    hex: "8E 00 51 3B 34 65 44 C6 04 05 00 D1 00 00 00"
    crc: absent
    note: "`private_fn` fn 0x08 reply. data[2..3] = D1 00 = 0xD1 = POS_SECURED_TARGET marker (the secured/rain/wind retreat-position setting). Stable across both window positions."
  - dir: rx
    t_ms: 0
    hex: "8E 00 51 3B 34 65 44 C6 04 05 00 C8 00 00 00"
    crc: absent
    note: "`private_fn` fn 0x0B reply. data[2..3] = C8 00 = 0xC800 = STATUS_POS_MAX (100% closed / full-scale). Stable across both window positions."
  - dir: rx
    t_ms: 0
    hex: "96 00 51 3B 34 65 44 C6 04 05 00 D8 03 D8 03 00 00 51 3B 34 01 00 00"
    crc: absent
    note: "`private_fn` fn 0x0D reply — like the fn 0x03 record but the resolved-position slot also holds the D8 03 vent selector (target and setpoint both 'vent')."
  - dir: rx
    t_ms: 0
    hex: "89 00 51 3B 34 65 44 C6 FE 58"
    crc: absent
    note: >
      `private_fn` fn 0x0F reply: CMD_ERROR_RESP (0xFE), result code 0x58 =
      RESULT_INVALID_FUNCTION_INDEX. The window implements function IDs 0x00–0x0E; 0x0F is past
      the end. END frame.
  - dir: rx
    t_ms: 0
    hex: "8E 00 51 3B 34 65 44 C6 04 2D 00 D8 03 00 00"
    crc: absent
    note: "`private_fn_sub` (fn 0x09), data[1] = 0x01. Reply data[0] = 0x2D (the 0x05 flags byte with two more bits set), then the D8 03 vent selector. No 00 20 field at this sub-index."
  - dir: rx
    t_ms: 0
    hex: "90 00 51 3B 34 65 44 C6 04 2D 00 D8 03 00 20 00 00"
    crc: absent
    note: "`private_fn_sub` (fn 0x09), data[1] = 0x03. Same 0x2D record, now with an appended 00 20 field. Both the 0x2D flag bits and the 00 20 field are undecoded."
