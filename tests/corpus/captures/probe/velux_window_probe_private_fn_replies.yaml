id: velux_window_probe_private_fn_replies
description: >
  CMD_PRIVATE (0x03) function-ID readback replies from a Velux INTEGRA roof-window actuator
  (WINDOW_OPENER, node 6544C6), captured by the reporter's own SX126x hub via the diagnostic
  probe_sweep action on issue #98 (2026-09-01). Two probes: `private_fn` walks the function-ID
  byte (data[0]) with data[1]=0x00, and `private_fn_sub` pins the function ID to 0x09 and walks
  data[1]. The window was parked at its ventilation preset (~7% open) for the sweep; one
  Session-1 frame from an earlier fully-open run is included for contrast.

  Human-verified readings (see issue #98 conversation_log.md / probe_findings_2026-09-01.md):
    - data[2..3] is big-endian on the STATUS_POS_MAX (0xC800) scale, 0x0000 = fully open.
    - BA 00 = 0xBA00 = 47616/51200 = 93.0% closed = the reporter's "7% open" vent position.
    - D8 03 = POS_FAVORITE (0xD8) + POS_VENT_MODIFIER (0x03): the "target = ventilation preset"
      selector, not a number (0xD803 > STATUS_POS_MAX, so the shipped decoder treats it as a
      marker). Same two bytes create_private2_read() sends.
    - D1 00 = 0xD1 = POS_SECURED_TARGET marker (the secured/environmental retreat setting).
    - C8 00 = 0xC800 = STATUS_POS_MAX (100% closed / full-scale).
    - 27 10 = 0x2710 = 10000, a stable constant across window positions (not %-of-0xC800).
    - fn 0x0F answers CMD_ERROR_RESP (0xFE) result code 0x58 -> RESULT_INVALID_FUNCTION_INDEX
      ("requested function/sub-index is not implemented by the device"), the same rejection a
      Somfy Sunea awning/dimmer gives for an out-of-range block
      (somfy_awning_probe_extended_fn_sx1262.yaml).
    - `private_fn_sub` with data[1] != 0 flips the reply's data[0] flags byte from 0x05 to 0x2D
      and, at an irregular subset of sub-indices, appends a 00 20 field; both undecoded.

  No TX probe frames were logged by the reporter; the replies stand alone (cf.
  velux_kig300_probe_capability_burst.yaml). Community capture: no system key, HMAC not verifiable.
source:
  device: "Velux INTEGRA roof-window actuator (WINDOW_OPENER, node 6544C6)"
  captured_with: sx1262
  firmware: null
  date: 2026-09-01
  origin: github-issue
  issue: "https://github.com/laberning/home_io_control/issues/98"
key: unknown
