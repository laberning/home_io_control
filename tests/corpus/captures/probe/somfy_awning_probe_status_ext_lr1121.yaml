id: somfy_awning_probe_status_ext_lr1121
description: >
  Step 2 Q1: extended CMD_PRIVATE (0x03 80 <block> 00) probes against our own awning, block=0x00
  then block=0x01. Both replies are byte-identical 23-byte CMD_PRIVATE_RESP frames (data=2D 00 D2
  00 0A 20 00 00 C0 FF EE 01 00 00), confirming this device answers the field-observed
  selector-0x80 mechanism at all -- no 0x20 control frame available to compare against
  (docs/radio_diagnostics.md notes the tooling gap: create_get_status_tilt() is only sent
  automatically to tilt-capable covers, and this awning isn't one). data[8..10]=C0 FF EE is our
  own controller's node ID, embedded verbatim in the reply. data[2]=0xD2 and data[5]=0x20
  numerically coincide with POS_STOP/STATUS_TILT_SELECTOR from unrelated contexts; noted, not
  claimed as a decode. That lack of difference (10 s apart, device untouched) is itself a data
  point -- either block doesn't select distinct content on this device, or nothing changed in the
  10 s window.
